<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Nuestro ramo</title>
  <meta name="description" content="Un ramo que gana una flor cada día, del 26 de octubre al 23 de noviembre de 2026." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" />
  <link rel="stylesheet" href="styles.css?v=mvq5l4vm" />
  <script type="importmap">
    { "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    } }
  </script>
</head>
<body>
  <canvas id="scene" role="img" aria-label="Ramo de flores en 3D que crece una flor por día"></canvas>

  <header class="caption">
    <p id="headline" class="headline">Un día más, una flor más.</p>
    <p id="progress" class="progress" aria-live="polite"></p>
    <p id="sim-badge" class="sim-badge" hidden>Simulación · no es la fecha real</p>
  </header>

  <div id="flower-label" class="flower-label" hidden></div>

  <p id="final" class="final">Nuestro ramo ha florecido por completo.</p>


  <script>
    // Si el ramo no arranca (error, sin WebGL, archivo que no carga), se dice en pantalla
    // en lugar de dejar la página en negro.
    (function () {
      function show(msg) {
        var p = document.getElementById("progress");
        if (p && !window.__ramo && !p.dataset.fixed) p.textContent = msg;
      }
      window.addEventListener("error", function (e) {
        show("No se pudo cargar el ramo: " + (e.message || "error de carga") + ". Prueba a recargar la página.");
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        show("No se pudo cargar el ramo: " + (e.reason && e.reason.message || e.reason) + ".");
      });
      setTimeout(function () { show("El ramo está tardando en cargar… prueba a recargar la página (Ctrl + Mayús + R)."); }, 9000);
    })();
  </script>
  <noscript><p class="caption">Este ramo necesita JavaScript.</p></noscript>
  <script type="module" src="src/entry.js?v=mvq5l4vm"></script>
</body>
</html>
