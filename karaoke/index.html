<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c10" />
  <title>karaoke para ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" />
  <style>
    :root { --ink: #111; --paper: #efede8; --pink: #ff6fae; }
    html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #ddd; overflow: hidden; }
    body { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; font-family: "Gochi Hand", cursive; }
    .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }
    .window { width: min(92vw, 75vh, 620px); background: var(--paper); border-radius: 10px; overflow: hidden;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06); transform: rotate(-1deg); }
    .bar { height: 26px; display: flex; align-items: center; gap: 7px; padding: 0 10px; background: #e3e1dc; border-bottom: 1px solid #cfccc6; }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .bar span { flex: 1; text-align: center; margin-right: 50px; font: 12px ui-sans-serif, system-ui, sans-serif; color: #555; }
    canvas { display: block; width: 100%; aspect-ratio: 240 / 160; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
    /* La letra: el renglón que se canta se va pintando de rosa, palabra por palabra. */
    .lyrics { width: min(92vw, 620px); min-height: 3.6em; text-align: center; }
    .lyrics p { margin: 0; line-height: 1.25; }
    .lyrics .now { font-size: clamp(22px, 4.6vw, 34px); color: #f4efe7; }
    .lyrics .next { font-size: clamp(16px, 3.2vw, 22px); color: rgba(244, 239, 231, 0.4); }
    .lyrics .now .w { --p: 0%; background: linear-gradient(90deg, var(--pink) var(--p), #f4efe7 var(--p));
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .actions { display: flex; gap: 10px; }
    .actions button { font: 22px "Gochi Hand", cursive; color: var(--ink); background: var(--paper); border: 2px solid var(--ink);
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; padding: 4px 18px 6px; cursor: pointer;
      box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.5); }
    .actions button:first-child { transform: rotate(-2deg); }
    .actions button:last-child { transform: rotate(1.5deg); }
    .actions button:focus-visible { outline: 2px dashed var(--pink); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="stage">
    <div class="window">
      <div class="bar"><i class="dot" style="background:#ff5f57"></i><i class="dot" style="background:#febc2e"></i><i class="dot" style="background:#28c840"></i><span>karaoke para ti</span></div>
      <canvas id="stage" width="240" height="160" role="img" aria-label="El muñequito de garabato canta en un escenario con micrófono, telón y reflector"></canvas>
    </div>
    <div id="lyrics" class="lyrics" aria-live="polite"></div>
    <div class="actions">
      <button id="play" type="button">cantar</button>
      <button id="again" type="button">otra vez</button>
    </div>
  </main>
  <script type="module" src="karaoke.js"></script>
</body>
</html>
