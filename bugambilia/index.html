<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1820" />
  <title>Bugambilia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Great+Vibes&display=swap" />
  <script type="importmap">
    { "imports": {
      "three": "../ramo/vendor/three/three.module.js",
      "three/addons/": "../ramo/vendor/three/addons/"
    } }
  </script>
  <style>
    :root { --ink: #f6e7ea; --dim: rgba(246, 231, 234, 0.6); --accent: #ff5fb0; }
    html, body { margin: 0; height: 100%; background: #2a1820; overflow: hidden; color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .msg { position: fixed; top: 40%; left: 0; right: 0; margin: 0; padding: 0 16px; text-align: center; font-size: 19px; color: var(--dim); }
    .msg:empty { display: none; }
  </style>
</head>
<body>
  <canvas id="scene" role="img" aria-label="Una bugambilia en 3D que crece al atardecer, florece en fucsia y una ráfaga lleva sus brácteas a escribir «Es que te amo tanto» en el cielo; tócala para verla otra vez"></canvas>
  <p id="msg" class="msg" aria-live="polite"></p>

  <script>
    (function () {
      function show(msg) {
        var p = document.getElementById("msg");
        if (p && !window.__bugambilia && !p.dataset.fixed) p.textContent = msg;
      }
      window.addEventListener("error", function (e) {
        show("No se pudo cargar la bugambilia: " + (e.message || "error de carga") + ". Prueba a recargar la página.");
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        show("No se pudo cargar la bugambilia: " + (e.reason && e.reason.message || e.reason) + ".");
      });
    })();
  </script>
  <noscript><p class="msg">Esta página necesita JavaScript.</p></noscript>
  <script type="module" src="src/entry.js?v=mw1myqzz"></script>
</body>
</html>
