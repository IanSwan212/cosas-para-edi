<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060a16" />
  <title>Bugambilia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" />
  <script type="importmap">
    { "imports": {
      "three": "../ramo/vendor/three/three.module.js",
      "three/addons/": "../ramo/vendor/three/addons/"
    } }
  </script>
  <style>
    :root { --ink: #f6e7ea; --dim: rgba(246, 231, 234, 0.6); --accent: #ff5fb0; }
    html, body { margin: 0; height: 100%; background: #060a16; overflow: hidden; color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .vignette { position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(2, 4, 10, 0.55) 100%); }
    .msg { position: fixed; top: 40%; left: 0; right: 0; margin: 0; padding: 0 16px; text-align: center; font-size: 19px; color: var(--dim); }
    .msg:empty { display: none; }
    .player { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      display: flex; align-items: center; gap: 6px; padding: 6px 10px; width: min(460px, calc(100vw - 32px)); box-sizing: border-box;
      border-radius: 999px; background: rgba(10, 14, 28, 0.62); border: 1px solid rgba(255, 95, 176, 0.22);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: opacity 0.8s ease; }
    .player.idle { opacity: 0.18; }
    .player:hover, .player:focus-within { opacity: 1; }
    .player button { flex: none; height: 32px; min-width: 32px; padding: 0 8px; border: 0; border-radius: 999px; background: transparent;
      color: var(--ink); font: italic 17px "Cormorant Garamond", Georgia, serif; cursor: pointer; display: grid; place-items: center; }
    .player button:hover { background: rgba(255, 95, 176, 0.14); }
    .player button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
    .player svg { width: 18px; height: 18px; }
    #bloom { display: flex; gap: 5px; }
    #play .i-play { display: none; }
    #play[aria-pressed="true"] .i-play { display: inline; }
    #play[aria-pressed="true"] .i-pause { display: none; }
    .track { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    #phase { font-size: 13px; font-style: italic; color: var(--dim); text-align: center; line-height: 1; }
    input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); height: 16px; }
    @media (max-width: 420px) { #bloom span { display: none; } }
  </style>
</head>
<body>
  <canvas id="scene" role="img" aria-label="Una bugambilia en 3D que crece, florece en fucsia y suelta sus brácteas al viento"></canvas>
  <div class="vignette"></div>
  <p id="msg" class="msg" aria-live="polite"></p>

  <div id="player" class="player">
    <button id="play" type="button" aria-pressed="false" aria-label="Pausar" title="Pausar">
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM13 5h3v14h-3z" fill="currentColor"/></svg>
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>
    </button>
    <button id="restart" type="button" aria-label="Reiniciar" title="Reiniciar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.1-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M5 4v4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="track">
      <span id="phase">Aparición</span>
      <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" aria-label="Momento de la animación" />
    </div>
    <button id="speed" type="button" aria-label="Velocidad" title="Velocidad">1×</button>
    <button id="bloom" type="button" aria-label="Ver la planta florecida" title="Ver la planta florecida">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c-3-1-5.5-4-4.5-7.5C11 4 12.5 8 12 12zm0 0c1-3 4-5.5 7.5-4.5C20 11 16 12.5 12 12zm0 0c3 1 5.5 4 4.5 7.5C13 20 11.5 16 12 12zm0 0c-1 3-4 5.5-7.5 4.5C4 13 8 11.5 12 12z" fill="currentColor"/></svg>
      <span>Florecida</span>
    </button>
  </div>

  <script>
    (function () {
      function show(msg) {
        var p = document.getElementById("msg");
        if (p && !window.__bugambilia && !p.dataset.fixed) p.textContent = msg;
      }
      window.addEventListener("error", function (e) {
        show("No se pudo cargar la bugambilia: " + (e.message || "error de carga") + ". Prueba a recargar la página.");
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        show("No se pudo cargar la bugambilia: " + (e.reason && e.reason.message || e.reason) + ".");
      });
    })();
  </script>
  <noscript><p class="msg">Esta página necesita JavaScript.</p></noscript>
  <script type="module" src="src/entry.js"></script>
</body>
</html>
