<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c10" />
  <title>te extraño...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #0c0c10; overflow: hidden; }
    body { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; }
    .window { width: min(88vw, 72vh, 480px); background: #efede8; border-radius: 10px; overflow: hidden;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06); transform: rotate(-1.5deg); }
    .bar { height: 26px; display: flex; align-items: center; gap: 7px; padding: 0 10px; background: #e3e1dc; border-bottom: 1px solid #cfccc6; }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .bar span { flex: 1; text-align: center; margin-right: 50px; font: 12px ui-sans-serif, system-ui, sans-serif; color: #555; }
    canvas { display: block; width: 100%; aspect-ratio: 180 / 150; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
  </style>
</head>
<body>
  <div class="window">
    <div class="bar"><i class="dot" style="background:#ff5f57"></i><i class="dot" style="background:#febc2e"></i><i class="dot" style="background:#28c840"></i><span>te extraño...</span></div>
    <canvas id="doodle" width="180" height="150" role="img" aria-label="Un muñequito dibujado a mano que escribe frases mientras suena una canción"></canvas>
  </div>
  <script type="module" src="cancion.js"></script>
</body>
</html>
