<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>La noche del 8 de abril</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" />
  <style>
    :root { --ink: #f6e7ea; --dim: rgba(246, 231, 234, 0.62); }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    header { position: fixed; top: max(20px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
      padding: 0 16px; pointer-events: none; text-shadow: 0 0 14px #000; animation: text-in 2s ease 2.2s both; }
    h1 { margin: 0; font-weight: 400; font-style: italic; font-size: clamp(22px, 3.4vw, 34px); }
    p { margin: 6px 0 0; font-size: clamp(14px, 1.6vw, 17px); color: var(--dim); letter-spacing: 0.03em; }
    @keyframes text-in { from { opacity: 0; transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { header { animation: none; } }
  </style>
</head>
<body>
  <canvas id="sky" role="img"
    aria-label="Cielo de Pachuca a las 7 de la tarde del 8 de abril de 2026, mirando al oeste: atardecer con Venus brillante y bajo, Júpiter casi en lo alto y Orión hacia el suroeste, dibujado con caracteres"></canvas>
  <header>
    <h1>La noche del 8 de abril</h1>
    <p>Pachuca · 7:10 de la tarde · mirando al oeste</p>
    <p>La luna aún no salía: llegó pasada la medianoche, a las 00:51</p>
  </header>
  <script>
    // Cielo real de Pachuca (20.10° N, 98.76° O) el 8 de abril de 2026 a las 19:10, hora local.
    // Posiciones calculadas con ephem: el sol estaba 4.7° bajo el horizonte (azimut 280°),
    // en pleno crepúsculo; Venus brillaba bajo en el oeste y Júpiter casi en el cenit.
    // [nombre, altura°, azimut°, magnitud]
    var BODIES = [["Venus", 17.22, 280.32, -3.82], ["Jupiter", 81.9, 290.96, -2.02], ["Sirius", 50.51, 202.09, -1.44], ["Procyon", 75.03, 183.37, 0.4], ["Capella", 50.57, 319.58, 0.08], ["Betelgeuse", 61.03, 247.83, 0.45], ["Rigel", 43.85, 235.86, 0.18], ["Aldebaran", 45.69, 273.42, 0.87], ["Pollux", 82.12, 4.44, 1.16], ["Castor", 78.14, 351.81, 1.58], ["Bellatrix", 53.92, 252.46, 1.64], ["Alnilam", 52.39, 239.27, 1.69], ["Alnitak", 52.85, 237.17, 1.74], ["Mintaka", 52.06, 241.47, 2.25], ["Saiph", 48.92, 226.25, 2.07], ["Elnath", 57.96, 292.15, 1.65], ["Menkalinan", 57.34, 325.38, 1.9], ["Mirzam", 47.15, 208.69, 1.98], ["Alhena", 74.15, 259.07, 1.93], ["Adhara", 39.75, 192.68, 1.5], ["Canopus", 15.21, 192.34, -0.62], ["Wezen", 42.72, 190.59, 1.83], ["Alcyone", 35.81, 285.9, 2.85], ["Hamal", 13.32, 290.58, 2.01], ["Mirfak", 31.58, 317.05, 1.79], ["Algol", 29.0, 306.64, 2.09]];
    var LABELS = { Venus: "Venus", Jupiter: "Júpiter", Sirius: "Sirio", Betelgeuse: "Orión" };
    var SUN_AZ = 280.0;
    var VIEW_AZ = 268;
    var RAMP = " .,:;i!lI?tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";

    var canvas = document.getElementById("sky");
    var ctx = canvas.getContext("2d");
    var ease = function (x) { return 1 - Math.pow(1 - x, 3); };
    function hash(x, y) { var h = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return h - Math.floor(h); }

    // p (0..1): progreso de la entrada. El crepúsculo se oscurece un poco y las estrellas
    // aparecen por orden de brillo, como esa tarde: primero Venus, luego Júpiter y Sirio...
    function draw(p) {
      var e = ease(p);
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W = window.innerWidth, H = window.innerHeight;
      if (canvas.width !== Math.round(W * dpr)) { canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);

      var cellH = Math.max(4, Math.min(7, Math.min(W, H) / 170));
      var cellW = cellH * 0.62;
      var cols = Math.ceil(W / cellW), rows = Math.ceil(H / cellH);
      var fovH = Math.max(90, Math.min(170, (W / H) * 110));
      var horizon = H * 0.84, top = H * 0.24;   // el cenit queda bajo el título
      function project(alt, az) {
        var d = ((az - VIEW_AZ + 540) % 360) - 180;
        return [W / 2 + d / fovH * W, horizon - alt / 88 * (horizon - top)];
      }
      var sunX = project(0, SUN_AZ)[0];

      ctx.font = "700 " + cellH + "px 'Courier New', monospace";
      ctx.textBaseline = "top";
      var groups = {};
      function put(x, y, col, lum) {
        if (x < 0 || y < 0 || x >= cols || y >= rows) return;
        var n = RAMP.length - 1;
        var ch = RAMP[Math.min(n, Math.max(1, Math.round(lum * n * 1.1)))];
        var q = (Math.min(255, col[0]) >> 3) << 10 | (Math.min(255, col[1]) >> 3) << 5 | (Math.min(255, col[2]) >> 3);
        (groups[q] = groups[q] || []).push(x, y, ch);
      }

      // Cielo del crepúsculo en caracteres: naranja sobre el horizonte del oeste, azul arriba.
      var dusk = 1 - 0.35 * e;
      for (var y = 0; y < rows; y++) {
        var py = (y + 0.5) * cellH;
        if (py > horizon + H * 0.03) break;
        var h = Math.max(0, (horizon - py) / (horizon - top));
        for (var x = 0; x < cols; x++) {
          var px = (x + 0.5) * cellW;
          var dsun = Math.abs(px - sunX) / W;
          var glow = 1.35 * Math.exp(-h * 3.6) * Math.exp(-dsun * dsun * 5) * dusk;
          var blue = 0.32 * (1 - h * 0.7) * dusk;
          var v = glow * 0.9 + blue * 0.35;
          if (v < 0.05 || hash(x, y) > v * 1.6) continue;
          var col = [40 + 215 * glow + 20 * blue | 0, 30 + 110 * glow + 60 * blue | 0, 70 + 30 * glow + 150 * blue | 0];
          put(x, y, col, Math.min(0.5, v * 0.6));
        }
      }

      // Estrellas y planetas, por orden de brillo durante la entrada.
      var labels = [];
      for (var i = 0; i < BODIES.length; i++) {
        var b = BODIES[i];
        var appear = (b[3] + 4) / 7.5;                       // Venus ≈ 0, estrellas débiles ≈ 0.9
        var a = Math.max(0, Math.min(1, (p * 1.25 - appear) / 0.2));
        if (a <= 0) continue;
        var pt = project(b[1], b[2]);
        if (pt[0] < -20 || pt[0] > W + 20) continue;
        var cx = Math.floor(pt[0] / cellW), cy = Math.floor(pt[1] / cellH);
        var bright = Math.max(0.25, Math.min(1, (3 - b[3]) / 6.8)) * a;
        var planet = b[0] === "Venus" || b[0] === "Jupiter";
        var col = b[0] === "Venus" ? [255, 246, 214] : b[0] === "Jupiter" ? [255, 236, 200]
          : b[0] === "Betelgeuse" || b[0] === "Aldebaran" ? [255, 200, 160] : [220, 230, 255];
        var rad = planet ? (b[0] === "Venus" ? 4 : 3) : bright > 0.7 ? 2 : 1;
        for (var dy = -rad; dy <= rad; dy++) for (var dx = -rad * 2; dx <= rad * 2; dx++) {
          var d = Math.hypot(dx / 2, dy) / rad;
          if (d > 1) continue;
          var cross = (dx === 0 || dy === 0) ? 1 : 0.45;
          var l = bright * Math.pow(1 - d, 1.6) * cross;
          if (l > 0.05) put(cx + dx, cy + dy, [col[0] * (0.5 + l) | 0, col[1] * (0.5 + l) | 0, col[2] * (0.5 + l) | 0], l);
        }
        if (LABELS[b[0]] && a > 0.6) labels.push([LABELS[b[0]], pt[0], pt[1] + (rad + 2) * cellH, (a - 0.6) / 0.4]);
      }

      // Cerros de Pachuca y luces de la ciudad.
      for (var yy = 0; yy < rows; yy++) {
        var py2 = (yy + 0.5) * cellH;
        for (var xx = 0; xx < cols; xx++) {
          var px2 = (xx + 0.5) * cellW;
          var hill = H * (0.86 - 0.05 * Math.sin(px2 / W * 5.2 + 0.7) - 0.03 * Math.sin(px2 / W * 13 + 2));
          if (py2 <= hill) continue;
          var r = hash(xx, yy);
          if (r < 0.012 * e && py2 > hill + 8) put(xx, yy, [255, 190, 110], 0.45);   // casas encendidas
          else if (r < 0.5) put(xx, yy, [16, 28, 40], 0.2);
        }
      }

      for (var key in groups) {
        var q = +key, list = groups[key];
        ctx.fillStyle = "rgb(" + ((q >> 10 & 31) * 8.2 | 0) + "," + ((q >> 5 & 31) * 8.2 | 0) + "," + ((q & 31) * 8.2 | 0) + ")";
        for (var j = 0; j < list.length; j += 3) ctx.fillText(list[j + 2], list[j] * cellW, list[j + 1] * cellH);
      }

      ctx.font = "italic " + Math.max(13, Math.min(18, W / 60)) + "px 'Cormorant Garamond', Georgia, serif";
      ctx.textAlign = "center";
      for (var k = 0; k < labels.length; k++) {
        ctx.fillStyle = "rgba(246,231,234," + 0.75 * labels[k][3] + ")";
        ctx.fillText(labels[k][0], labels[k][1], labels[k][2]);
      }
      ctx.textAlign = "start";
    }

    var ENTRY = 4.5;
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var t0 = performance.now();
    function tick(now) {
      var p = Math.min(1, (now - t0) / 1000 / ENTRY);
      draw(p);
      if (p < 1) requestAnimationFrame(tick);
    }
    if (reduced) draw(1); else requestAnimationFrame(tick);
    var t;
    window.addEventListener("resize", function () { clearTimeout(t); t = setTimeout(function () { draw(1); }, 200); });
    window.__cielo = { draw: draw };
  </script>
</body>
</html>
