<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>La noche del 8 de abril</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" />
  <style>
    :root { --ink: #f6e7ea; --dim: rgba(246, 231, 234, 0.62); --accent: #ff9ab0; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; transition: opacity 2.4s ease; }
    #moon { opacity: 0; }
    body.night #sunset { opacity: 0; }
    body.night #moon { opacity: 1; }
    header { position: fixed; top: max(20px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
      padding: 0 16px; pointer-events: none; text-shadow: 0 0 14px #000; }
    h1 { margin: 0; font-weight: 400; font-style: italic; font-size: clamp(22px, 3.4vw, 34px); }
    header p { margin: 6px 0 0; font-size: clamp(14px, 1.6vw, 17px); color: var(--dim); letter-spacing: 0.03em;
      transition: opacity 0.8s ease; }
    header p.date { margin-top: 4px; font-size: clamp(17px, 2.1vw, 22px); font-style: italic; color: var(--accent);
      letter-spacing: 0.02em; animation: fade-in 2s ease 1s both; }
    .switch { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      padding: 10px 22px; border-radius: 999px; border: 1px solid rgba(255, 154, 176, 0.5);
      background: rgba(12, 8, 14, 0.7); color: var(--ink); font: italic 19px "Cormorant Garamond", Georgia, serif;
      cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      animation: fade-in 1.5s ease 2.5s both; transition: background 0.2s; }
    .switch:hover { background: rgba(255, 154, 176, 0.16); }
    .switch:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
    @keyframes fade-in { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { canvas, header p { transition: none; } .switch { animation: none; } }
    .mute {
      position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
      width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%;
      background: transparent; color: #f6e7ea; opacity: 0.4; cursor: pointer; transition: opacity 0.2s; z-index: 2;
    }
    .mute:hover, .mute:focus-visible { opacity: 0.9; }
    .mute svg { width: 22px; height: 22px; }
    .mute .cross { display: none; }
    .mute[aria-pressed="true"] .waves { display: none; }
    .mute[aria-pressed="true"] .cross { display: inline; }
  </style>
</head>
<body>
  <canvas id="sunset" role="img" aria-label="Atardecer en Pachuca a las 7 de la tarde del 8 de abril de 2026, dibujado con caracteres"></canvas>
  <canvas id="moon" role="img" aria-label="La luna menguante gibosa, 59 % iluminada, de la noche del 8 al 9 de abril de 2026 sobre Pachuca, dibujada con caracteres"></canvas>
  <header>
    <h1>La noche del 8 de abril</h1>
    <p class="date">El día de nuestra primera cita</p>
    <p id="sub">Pachuca · el atardecer de las 7 de la tarde</p>
  </header>
  <button id="mute" class="mute" type="button" aria-pressed="false" aria-label="Silenciar música" title="Silenciar música">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" fill="currentColor"/><path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path class="cross" d="M16 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  </button>
  <script>
    // Música de fondo muy tenue (5 %). Empieza con el primer toque, clic o tecla,
    // porque los navegadores no dejan sonar antes; el botón la silencia y se recuerda.
    (function () {
      var VOLUME = 0.05, KEY = "luna.silencio";
      var music = new Audio("assets/cancion.mp3");
      music.loop = true;
      music.volume = 0;
      var btn = document.getElementById("mute");
      var muted = false;
      try { muted = localStorage.getItem(KEY) === "1"; } catch (e) {}
      function apply() {
        music.muted = muted;
        btn.setAttribute("aria-pressed", String(muted));
        var label = muted ? "Activar música" : "Silenciar música";
        btn.setAttribute("aria-label", label);
        btn.title = label;
      }
      apply();
      btn.addEventListener("click", function () {
        muted = !muted;
        apply();
        try { localStorage.setItem(KEY, muted ? "1" : "0"); } catch (e) {}
      });
      function start() {
        window.removeEventListener("pointerdown", start, true);
        window.removeEventListener("keydown", start, true);
        music.play().then(function () {
          var t0 = performance.now();
          (function fade() {
            var k = Math.min(1, (performance.now() - t0) / 4000);
            music.volume = VOLUME * k;
            if (k < 1) requestAnimationFrame(fade);
          })();
        }).catch(function () {});
      }
      window.addEventListener("pointerdown", start, true);
      window.addEventListener("keydown", start, true);
    })();
  </script>
  <button id="switch" class="switch" type="button">Ver la luna de esa noche</button>
  <script>
    // Dos momentos reales de esa noche en Pachuca (20.10° N, 98.76° O), en ASCII de colores como el ramo:
    //  1. El atardecer a las 19:10: el sol se puso a las 18:51 por el oeste (azimut 280°) y estaba
    //     4.7° bajo el horizonte; quedaba el resplandor naranja y rosado.
    //  2. La luna de esa noche: menguante gibosa, ~59 % iluminada; salió a las 00:51 del 9 de abril.
    //     Vista desde Pachuca, su lado iluminado apuntaba abajo a la izquierda (−125°).
    // Calculado con ephem; fase y salida de la luna contrastadas con el USNO.
    var ILLUM = 0.59, LIMB_DEG = -125;
    var RAMP = " .,:;i!lI?tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
    var MARIA = [[-0.32, 0.42, 0.26], [0.17, 0.42, 0.16], [0.3, 0.14, 0.19], [0.66, 0.3, 0.12], [0.55, -0.12, 0.15],
      [0.36, -0.28, 0.11], [-0.2, -0.36, 0.16], [-0.62, 0.08, 0.34], [-0.46, -0.42, 0.1], [0.0, 0.72, 0.09], [-0.12, 0.1, 0.12]];
    var SUBTITLES = {
      sunset: "Pachuca · el atardecer de las 7 de la tarde",
      night: "Esa noche · luna menguante gibosa, 59 % iluminada · salió a las 00:51"
    };

    var ease = function (x) { return 1 - Math.pow(1 - x, 3); };
    function hash(x, y) { var h = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return h - Math.floor(h); }

    // Utilidades comunes: lienzo, rejilla de caracteres y dibujo agrupado por color.
    function grid(canvas) {
      var dpr = Math.min(window.devicePixelRatio || 1, 2), W = window.innerWidth, H = window.innerHeight;
      if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      }
      var ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
      var cellH = Math.max(4, Math.min(7, Math.min(W, H) / 170)), cellW = cellH * 0.62;
      ctx.font = "700 " + cellH + "px 'Courier New', monospace"; ctx.textBaseline = "top";
      var groups = {};
      return {
        ctx: ctx, W: W, H: H, cellW: cellW, cellH: cellH, cols: Math.ceil(W / cellW), rows: Math.ceil(H / cellH),
        put: function (x, y, col, lum) {
          var n = RAMP.length - 1, ch = RAMP[Math.min(n, Math.max(1, Math.round(lum * n * 1.1)))];
          var q = (Math.min(255, col[0]) >> 3) << 10 | (Math.min(255, col[1]) >> 3) << 5 | (Math.min(255, col[2]) >> 3);
          (groups[q] = groups[q] || []).push(x, y, ch);
        },
        flush: function () {
          for (var k in groups) {
            var q = +k, list = groups[k];
            ctx.fillStyle = "rgb(" + ((q >> 10 & 31) * 8.2 | 0) + "," + ((q >> 5 & 31) * 8.2 | 0) + "," + ((q & 31) * 8.2 | 0) + ")";
            for (var j = 0; j < list.length; j += 3) ctx.fillText(list[j + 2], list[j] * cellW, list[j + 1] * cellH);
          }
          groups = {};
        }
      };
    }

    function hills(g, x, y, lights) {
      var px = (x + 0.5) * g.cellW, py = (y + 0.5) * g.cellH;
      var top = g.H * (0.86 - 0.05 * Math.sin(px / g.W * 5.2 + 0.7) - 0.03 * Math.sin(px / g.W * 13 + 2));
      if (py <= top) return false;
      var r = hash(x, y);
      if (r < 0.012 * lights && py > top + 8) g.put(x, y, [255, 190, 110], 0.45);   // casas encendidas
      else if (r < 0.55) g.put(x, y, [16, 28, 40], 0.2);
      return true;
    }

    // Escena 1: atardecer. p = progreso de la entrada (el resplandor se enciende).
    function drawSunset(p) {
      var e = ease(p), g = grid(document.getElementById("sunset"));
      var horizon = g.H * 0.84, sunX = g.W * 0.5;
      for (var y = 0; y < g.rows; y++) for (var x = 0; x < g.cols; x++) {
        if (hills(g, x, y, e)) continue;
        var px = (x + 0.5) * g.cellW, py = (y + 0.5) * g.cellH;
        var h = Math.max(0, (horizon - py) / horizon), d = (px - sunX) / g.W;
        var glow = 1.5 * Math.exp(-h * 3.2) * Math.exp(-d * d * 3.5) * (0.35 + 0.65 * e);
        var blue = 0.4 * (1 - h * 0.8);
        var v = glow * 0.9 + blue * 0.3;
        if (hash(x + 3, y) < 0.0025 * (1 - glow) && h > 0.35) { g.put(x, y, [220, 225, 245], 0.3 * e); continue; }  // primeras estrellas
        if (v < 0.05 || hash(x, y) > v * 1.7) continue;
        var warm = Math.min(1, glow);
        g.put(x, y, [50 + 205 * warm + 20 * blue | 0, 30 + 120 * warm * (1 - h) + 50 * blue | 0, 80 + 60 * (1 - warm) + 120 * blue * (1 - warm) | 0], Math.min(0.6, v * 0.65));
      }
      g.flush();
    }

    // Escena 2: la luna de esa noche. p = progreso de su entrada (sube y se enciende).
    function drawMoon(p) {
      var e = ease(p), g = grid(document.getElementById("moon"));
      var R = Math.min(g.W, g.H) * 0.2, mx = g.W * 0.58, my = g.H * 0.5 + (1 - e) * g.H * 0.1;
      var ph = Math.acos(2 * ILLUM - 1), lb = LIMB_DEG * Math.PI / 180;
      var sx = Math.sin(ph) * Math.cos(lb), sy = Math.sin(ph) * Math.sin(lb), sz = Math.cos(ph);
      for (var y = 0; y < g.rows; y++) for (var x = 0; x < g.cols; x++) {
        if (hills(g, x, y, 0.6)) continue;
        var px = (x + 0.5) * g.cellW, py = (y + 0.5) * g.cellH;
        var dx = (px - mx) / R, dy = -(py - my) / R, rr = dx * dx + dy * dy;
        if (rr <= 1) {
          var dz = Math.sqrt(1 - rr), lit = Math.max(0, Math.min(1, (dx * sx + dy * sy + dz * sz) * 4 + 0.5));
          var al = 1;
          for (var k = 0; k < MARIA.length; k++) { var m = MARIA[k], ex = dx - m[0], ey = dy - m[1]; al -= 0.5 * Math.exp(-(ex * ex + ey * ey) / (m[2] * m[2])); }
          al = Math.max(0.35, al) * (0.9 + 0.1 * Math.sin(dx * 37 + dy * 23));
          var v = Math.max(lit * al * (0.75 + 0.25 * dz) * (0.15 + 0.85 * e), 0.06 * (1 - lit) * e);
          if (v >= 0.03) g.put(x, y, [60 + 215 * v | 0, 60 + 205 * v | 0, 72 + 180 * v | 0], v);
          continue;
        }
        var halo = Math.exp(-(Math.sqrt(rr) - 1) * 3.2) * 0.16 * e;
        var st = hash(y, x);
        if (st < 0.004 && hash(x + 1, y) < p * 1.4) {
          var b = 0.25 + 0.75 * Math.pow(hash(x, y + 1), 3);
          g.put(x, y, [200 + 55 * b | 0, 200 + 55 * b | 0, 230], b * 0.5);
        } else if (halo > 0.05 && hash(x + 7, y) < halo * 3) g.put(x, y, [70, 80, 110], 0.08);
      }
      g.flush();
    }

    function animate(fn, seconds, done) {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { fn(1); if (done) done(); return; }
      var t0 = performance.now();
      (function tick(now) {
        var p = Math.min(1, (now - t0) / 1000 / seconds);
        fn(p);
        if (p < 1) requestAnimationFrame(tick); else if (done) done();
      })(t0);
    }

    var night = false, btn = document.getElementById("switch"), sub = document.getElementById("sub");
    btn.addEventListener("click", function () {
      night = !night;
      document.body.classList.toggle("night", night);
      sub.style.opacity = 0;
      setTimeout(function () { sub.textContent = night ? SUBTITLES.night : SUBTITLES.sunset; sub.style.opacity = 1; }, 800);
      btn.textContent = night ? "Volver al atardecer" : "Ver la luna de esa noche";
      if (night) animate(drawMoon, 3.5); else animate(drawSunset, 2.5);
    });

    var t;
    window.addEventListener("resize", function () { clearTimeout(t); t = setTimeout(function () { drawSunset(1); drawMoon(1); }, 200); });
    drawMoon(0);
    animate(drawSunset, 3);
    window.__noche = { drawSunset: drawSunset, drawMoon: drawMoon };
  </script>
</body>
</html>
