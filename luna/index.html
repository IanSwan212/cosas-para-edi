<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>La noche del 8 de abril</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" />
  <style>
    :root { --ink: #f6e7ea; --dim: rgba(246, 231, 234, 0.6); }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    header { animation: text-in 2s ease 1.6s both; }
    @keyframes text-in { from { opacity: 0; transform: translateY(-6px); } }
    header { position: fixed; top: max(20px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
      padding: 0 16px; pointer-events: none; }
    h1 { margin: 0; font-weight: 400; font-style: italic; font-size: clamp(22px, 3.4vw, 34px); }
    p { margin: 6px 0 0; font-size: clamp(14px, 1.6vw, 17px); color: var(--dim); letter-spacing: 0.03em; }
    @media (prefers-reduced-motion: reduce) { header { animation: none; } }
  </style>
</head>
<body>
  <canvas id="sky" role="img"
    aria-label="Cielo nocturno de Pachuca la noche del 8 al 9 de abril de 2026, con la luna menguante gibosa iluminada en un 59 %, dibujado con caracteres"></canvas>
  <header>
    <h1>La noche del 8 de abril</h1>
    <p>Pachuca · luna menguante gibosa, 59 % iluminada · salió a las 00:51</p>
  </header>
  <script>
    // Cielo de Pachuca, 9 de abril de 2026 a las 2:00 (hora local), dibujado en ASCII de colores
    // como el ramo. Datos calculados con la biblioteca ephem y contrastados con el USNO:
    //  - luna menguante gibosa, ~59 % iluminada (llena el 1 de abril, cuarto menguante el 9 a las 22:51);
    //  - salió a las 00:51 del 9 de abril; a las 2:00 estaba a 12° de altura hacia el sureste (azimut 126°);
    //  - visto desde Pachuca, su lado iluminado apuntaba abajo a la izquierda (−125° desde la derecha).
    var ILLUM = 0.59;
    var LIMB_DEG = -125;
    var RAMP = " .,:;i!lI?tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";

    // Mares lunares principales (posiciones aproximadas en el disco, x→este del cielo, y→norte).
    var MARIA = [
      [-0.32, 0.42, 0.26], [0.17, 0.42, 0.16], [0.3, 0.14, 0.19], [0.66, 0.3, 0.12],
      [0.55, -0.12, 0.15], [0.36, -0.28, 0.11], [-0.2, -0.36, 0.16], [-0.62, 0.08, 0.34],
      [-0.46, -0.42, 0.1], [0.0, 0.72, 0.09], [-0.12, 0.1, 0.12]
    ];

    var canvas = document.getElementById("sky");
    var ctx = canvas.getContext("2d");

    function rng(seed) {
      return function () {
        seed = (seed * 16807) % 2147483647;
        return seed / 2147483647;
      };
    }

    // Ruido fijo por celda: así los cerros y el halo no parpadean durante la entrada.
    function hash(x, y) {
      var h = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
      return h - Math.floor(h);
    }
    var ease = function (x) { return 1 - Math.pow(1 - x, 3); };

    // p (0..1): progreso de la entrada. La luna sube un poco y se va encendiendo,
    // y las estrellas aparecen detrás; al terminar queda la imagen fija.
    function draw(p) {
      if (p === undefined) p = 1;
      var e = ease(p);
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W = window.innerWidth, H = window.innerHeight;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);

      var cellH = Math.max(4, Math.min(7, Math.min(W, H) / 170));
      var cellW = cellH * 0.62;
      var cols = Math.ceil(W / cellW), rows = Math.ceil(H / cellH);
      ctx.font = "700 " + cellH + "px 'Courier New', monospace";
      ctx.textBaseline = "top";

      // Luna: algo a la derecha y baja, como sobre el sureste.
      var R = Math.min(W, H) * 0.2;
      var mx = W * 0.6, my = H * 0.52 + (1 - e) * H * 0.08;
      // Dirección del sol en el marco de la luna: ángulo de fase según la iluminación.
      var phase = Math.acos(2 * ILLUM - 1);
      var limb = LIMB_DEG * Math.PI / 180;
      var sx = Math.sin(phase) * Math.cos(limb), sy = Math.sin(phase) * Math.sin(limb), sz = Math.cos(phase);

      var r = rng(42);
      var stars = {};
      for (var i = 0; i < cols * rows * 0.004; i++) {
        stars[Math.floor(r() * cols * rows)] = 0.25 + 0.75 * Math.pow(r(), 3);
      }

      var groups = {};
      function put(x, y, col, lum) {
        var n = RAMP.length - 1;
        var ch = RAMP[Math.min(n, Math.max(1, Math.round(lum * n * 1.1)))];
        var q = (col[0] >> 3) << 10 | (col[1] >> 3) << 5 | (col[2] >> 3);
        (groups[q] = groups[q] || []).push(x, y, ch);
      }

      for (var y = 0; y < rows; y++) {
        for (var x = 0; x < cols; x++) {
          var px = (x + 0.5) * cellW, py = (y + 0.5) * cellH;
          // Cerros de alrededor de Pachuca: silueta suave abajo.
          var hill = H * (0.88 - 0.05 * Math.sin(px / W * 5.2 + 0.7) - 0.03 * Math.sin(px / W * 13 + 2));
          if (py > hill) {
            var d = (py - hill) / (H - hill);
            if (hash(x, y) < 0.55) put(x, y, [18, 34 + 20 * (1 - d) | 0, 48], 0.22);
            continue;
          }
          var dx = (px - mx) / R, dy = -(py - my) / R, rr = dx * dx + dy * dy;
          if (rr <= 1) {
            var dz = Math.sqrt(1 - rr);
            var light = dx * sx + dy * sy + dz * sz;
            var lit = Math.max(0, Math.min(1, light * 4 + 0.5));      // terminador suave
            var albedo = 1;
            for (var k = 0; k < MARIA.length; k++) {
              var m = MARIA[k], ex = dx - m[0], ey = dy - m[1];
              albedo -= 0.5 * Math.exp(-(ex * ex + ey * ey) / (m[2] * m[2]));
            }
            albedo = Math.max(0.35, albedo) * (0.9 + 0.1 * Math.sin(dx * 37 + dy * 23));
            var limbDark = 0.75 + 0.25 * dz;
            var b = lit * albedo * limbDark * (0.15 + 0.85 * e);
            var earthshine = 0.06 * (1 - lit) * e;
            var v = Math.max(b, earthshine);
            if (v < 0.03) continue;
            var c = [Math.min(255, 60 + 215 * v) | 0, Math.min(255, 60 + 205 * v) | 0, Math.min(255, 72 + 180 * v) | 0];
            put(x, y, c, v);
            continue;
          }
          // Halo tenue alrededor de la luna.
          var halo = Math.exp(-(Math.sqrt(rr) - 1) * 3.2) * 0.16 * e;
          var s = stars[y * cols + x];
          // Cada estrella aparece en su momento durante la entrada.
          if (s && hash(y, x) < p * 1.4) {
            put(x, y, [200 + 55 * s | 0, 200 + 55 * s | 0, 230], s * 0.5);
          } else if (halo > 0.05 && hash(x + 7, y) < halo * 3) {
            put(x, y, [70, 80, 110], 0.08);
          }
        }
      }

      for (var key in groups) {
        var q = +key, list = groups[key];
        ctx.fillStyle = "rgb(" + ((q >> 10 & 31) * 8.2 | 0) + "," + ((q >> 5 & 31) * 8.2 | 0) + "," + ((q & 31) * 8.2 | 0) + ")";
        for (var j = 0; j < list.length; j += 3) ctx.fillText(list[j + 2], list[j] * cellW, list[j + 1] * cellH);
      }
    }

    var ENTRY = 3.5; // segundos
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var t0 = performance.now();
    function tick(now) {
      var p = Math.min(1, (now - t0) / 1000 / ENTRY);
      draw(p);
      if (p < 1) requestAnimationFrame(tick);
    }
    if (reduced) draw(1); else requestAnimationFrame(tick);

    var t;
    window.addEventListener("resize", function () { clearTimeout(t); t = setTimeout(function () { draw(1); }, 200); });
  </script>
</body>
</html>
