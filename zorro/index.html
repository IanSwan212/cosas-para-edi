<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Kitsune</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" />
  <style>
    :root { --ink: #f6e7ea; --dim: rgba(246, 231, 234, 0.62); --accent: #ff9ab0; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
    header { position: fixed; top: max(20px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
      padding: 0 16px; pointer-events: none; text-shadow: 0 0 14px #000; animation: fade-in 2s ease both; }
    h1 { margin: 0; font-weight: 400; font-style: italic; font-size: clamp(22px, 3.4vw, 34px); }
    header p { margin: 6px 0 0; font-size: clamp(14px, 1.6vw, 17px); color: var(--dim); letter-spacing: 0.03em; }
    .hint { position: fixed; left: 0; right: 0; bottom: max(22px, env(safe-area-inset-bottom)); text-align: center;
      margin: 0; padding: 0 60px; font-style: italic; font-size: 17px; color: var(--dim); pointer-events: none;
      animation: fade-in 1.5s ease 3s both; }
    @keyframes fade-in { from { opacity: 0; } }
  </style>
</head>
<body>
  <canvas id="art" role="img" aria-label="Una kitsune, un zorro de nueve colas, sentada de perfil entre fuegos fatuos azules, dibujada con caracteres"></canvas>
  <header>
    <h1>Kitsune</h1>
    <p>Nueve colas para cuidarte</p>
  </header>
  <p class="hint">Tócala</p>
  <script>
    // Kitsune (zorro de nueve colas) sentada de perfil, en ASCII de colores como el ramo y la luna.
    // Cada fotograma se pinta con trazos y degradados en un lienzo oculto de un píxel por celda;
    // luego cada píxel se convierte en un carácter según su brillo y con su color.
    // Las colas se mecen, la kitsune respira y parpadea y los kitsunebi (fuegos fatuos) flotan;
    // al tocarla, las colas se abren en abanico y suben corazones.
    var RAMP = " .,:;i!lI?tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
    var canvas = document.getElementById("art"), ctx = canvas.getContext("2d");
    var off = document.createElement("canvas"), oc = off.getContext("2d", { willReadFrequently: true });
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var W, H, cellW, cellH, cols, rows, S, ox, oy, flare = 0, hearts = [];

    function hash(x, y) { var h = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return h - Math.floor(h); }

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cellH = Math.max(4.5, Math.min(7, Math.min(W, H) / 150)); cellW = cellH * 0.62;
      cols = Math.ceil(W / cellW); rows = Math.ceil(H / cellH);
      off.width = cols; off.height = rows;
      // Escena en unidades: la kitsune ocupa x 10..150, y −35..97 (y hacia abajo).
      S = Math.min(W / 185, (H * 0.74) / 150);
      ox = W / 2 - 88 * S; oy = H * 0.9 - 97 * S;
    }

    // Una cola: banda que se ensancha y se afila, con la punta blanca.
    function tail(c, bx, by, ang, len, curl, wid) {
      var n = 22, L = [], R = [];
      var dx = Math.cos(ang), dy = Math.sin(ang), px = -dy, py = dx;
      var tipX = 0, tipY = 0;
      for (var i = 0; i <= n; i++) {
        var u = i / n;
        var x = bx + dx * len * u + px * curl * u * u, y = by + dy * len * u + py * curl * u * u;
        var tx = dx + px * curl * 2 * u / len, ty = dy + py * curl * 2 * u / len, tl = Math.hypot(tx, ty);
        var r = wid * Math.pow(Math.sin(Math.PI * Math.min(1, 0.18 + u * 0.82)), 0.45);
        L.push([x - ty / tl * r, y + tx / tl * r]); R.push([x + ty / tl * r, y - tx / tl * r]);
        tipX = x; tipY = y;
      }
      c.beginPath(); c.moveTo(L[0][0], L[0][1]);
      for (i = 1; i <= n; i++) c.lineTo(L[i][0], L[i][1]);
      for (i = n; i >= 0; i--) c.lineTo(R[i][0], R[i][1]);
      c.closePath();
      var g = c.createLinearGradient(bx, by, tipX, tipY);
      g.addColorStop(0, "#5a1f0b"); g.addColorStop(0.35, "#c4521c"); g.addColorStop(0.7, "#f08a3c");
      g.addColorStop(0.84, "#f6c39a"); g.addColorStop(0.92, "#fff6ec"); g.addColorStop(1, "#ffffff");
      c.fillStyle = g; c.fill();
      c.strokeStyle = "rgba(0,0,0,0.9)"; c.lineWidth = 1.2; c.stroke();
    }

    function path(c, pts) {
      c.beginPath(); c.moveTo(pts[0], pts[1]);
      for (var i = 2; i < pts.length; i += 6) c.bezierCurveTo(pts[i], pts[i + 1], pts[i + 2], pts[i + 3], pts[i + 4], pts[i + 5]);
      c.closePath();
    }

    function scene(c, t) {
      var breath = Math.sin(t * 1.5) * 0.6;
      // Kitsunebi detrás.
      for (var k = 0; k < 6; k++) {
        var a = t * 0.25 + k * 0.9, fx = 85 + Math.cos(a) * (72 + 6 * Math.sin(t + k)), fy = 25 + Math.sin(a * 1.3 + k) * 45;
        var fr = 3 + 1 * Math.sin(t * 3 + k * 2);
        var g = c.createRadialGradient(fx, fy, 0, fx, fy, fr * 2.4);
        g.addColorStop(0, "rgba(235,250,255,1)"); g.addColorStop(0.3, "rgba(110,190,255,0.95)");
        g.addColorStop(0.7, "rgba(40,90,220,0.45)"); g.addColorStop(1, "rgba(20,40,160,0)");
        c.fillStyle = g; c.beginPath(); c.arc(fx, fy, fr * 2.4, 0, 7); c.fill();
      }
      // Nueve colas en abanico detrás del cuerpo.
      for (var i = 0; i < 9; i++) {
        var f = i / 8;
        var ang = -2.05 + f * 1.6 + flare * (f - 0.5) * 0.6 + Math.sin(t * 1.1 + i * 0.7) * 0.07;
        var len = 70 + 8 * Math.sin(i * 2.3) + flare * 10;
        var curl = (f - 0.5) * 16 + Math.sin(t * 0.9 + i) * 6;
        tail(c, 74, 72, ang, len, curl, 10);
      }
      // Cuerpo sentado de perfil, mirando a la izquierda.
      var gb = c.createLinearGradient(30, 30, 85, 95);
      gb.addColorStop(0, "#f39448"); gb.addColorStop(0.55, "#cf5e22"); gb.addColorStop(1, "#6e2810");
      path(c, [40, 36 + breath,
        33, 46, 30, 58, 33, 68,          // pecho
        34, 76, 33, 86, 32, 93,          // pata delantera
        30, 96, 39, 97, 40, 93,          // mano
        41, 84, 42, 78, 47, 78,          // detrás de la pata
        52, 70, 66, 64, 74, 72,          // muslo
        80, 80, 80, 92, 76, 96,          // anca
        70, 98, 56, 98, 52, 95,          // pie trasero
        60, 92, 62, 88, 62, 84,
        66, 84, 84, 88, 84, 74,          // espalda baja
        84, 58, 70, 44, 58, 32,          // lomo
        54, 28, 46, 28, 40, 36 + breath]);
      c.fillStyle = gb; c.fill();
      c.strokeStyle = "#000"; c.lineWidth = 1.6; c.stroke();
      // Pecho blanco.
      c.fillStyle = "#fbefe2";
      path(c, [36, 40, 31, 50, 31, 62, 35, 70, 39, 62, 41, 50, 44, 40, 42, 36, 38, 36, 36, 40]);
      c.fill();
      // Patas oscuras (calcetines).
      c.fillStyle = "#2a120a";
      path(c, [33, 80, 33, 87, 32, 93, 31, 96, 35, 97, 39, 97, 40, 93, 40, 87, 41, 80, 37, 79, 35, 79, 33, 80]); c.fill();
      path(c, [52, 95, 56, 98, 66, 98, 70, 97, 68, 93, 62, 92, 58, 92, 54, 92, 52, 93, 52, 95]); c.fill();
      // Cabeza.
      var hy = breath * 0.5;
      c.save(); c.translate(0, hy);
      var gh = c.createLinearGradient(20, 15, 58, 42);
      gh.addColorStop(0, "#f7a45c"); gh.addColorStop(1, "#b9461a");
      // Orejas.
      c.fillStyle = "#3a160b"; c.strokeStyle = "#000"; c.lineWidth = 1.4;
      path(c, [50, 22, 51, 14, 53, 7, 56, 1, 59, 9, 60, 18, 58, 28, 54, 26, 52, 24, 50, 22]); c.stroke(); c.fill();
      c.fillStyle = "#d8662a";
      path(c, [41, 22, 41, 14, 42, 7, 44, 1, 48, 8, 51, 16, 52, 24, 48, 23, 44, 23, 41, 22]); c.stroke(); c.fill();
      c.fillStyle = "#f3d9c2";
      path(c, [43, 20, 43, 14, 44, 9, 45, 6, 47, 11, 49, 16, 49, 21, 47, 21, 45, 21, 43, 20]); c.fill();
      // Cráneo y hocico largo.
      c.fillStyle = gh;
      c.strokeStyle = "#000"; c.lineWidth = 1.6;
      path(c, [58, 30, 58, 22, 50, 17, 42, 19,
        36, 20, 31, 25, 25, 29,            // frente y puente
        20, 31, 16, 32, 14, 34,            // nariz
        16, 37, 22, 38, 28, 38,            // mandíbula
        34, 42, 42, 46, 50, 44,            // mejilla
        56, 40, 58, 36, 58, 30]);
      c.stroke(); c.fill();
      // Hocico y mejilla blancos.
      c.fillStyle = "#fbefe2";
      path(c, [15, 35, 20, 37, 26, 37, 30, 37, 36, 40, 42, 44, 50, 44, 44, 47, 36, 46, 28, 42, 20, 39, 15, 35]); c.fill();
      // Nariz y boca.
      c.fillStyle = "#120806"; c.beginPath(); c.ellipse(14.6, 33.6, 1.9, 1.4, 0, 0, 7); c.fill();
      c.strokeStyle = "#2a120a"; c.lineWidth = 0.6;
      c.beginPath(); c.moveTo(16, 36); c.quadraticCurveTo(22, 37.5, 27, 36.8); c.stroke();
      // Ojo almendrado (parpadea).
      var blink = (t % 5.1) < 0.15 ? 0.15 : 1;
      c.fillStyle = "#1a0b06"; c.beginPath(); c.ellipse(34, 26.5, 3.4, 1.7 * blink, -0.25, 0, 7); c.fill();
      if (blink === 1) {
        c.fillStyle = "#f2b630"; c.beginPath(); c.ellipse(34.4, 26.4, 2.2, 1.3, -0.25, 0, 7); c.fill();
        c.fillStyle = "#120806"; c.beginPath(); c.ellipse(34.4, 26.4, 0.6, 1.2, 0, 0, 7); c.fill();
        c.fillStyle = "#ffffff"; c.beginPath(); c.arc(33.6, 25.8, 0.5, 0, 7); c.fill();
      }
      // Marcas rojas de kitsune en la frente.
      c.strokeStyle = "#ff3a3a"; c.lineWidth = 1.1;
      c.beginPath(); c.moveTo(38, 22); c.quadraticCurveTo(42, 18.5, 46, 21); c.stroke();
      c.beginPath(); c.moveTo(30, 29); c.quadraticCurveTo(34, 31.5, 39, 29.5); c.stroke();
      c.restore();
    }

    function frame(t) {
      oc.setTransform(1, 0, 0, 1, 0, 0); oc.clearRect(0, 0, cols, rows);
      oc.setTransform(S / cellW, 0, 0, S / cellH, ox / cellW, oy / cellH);
      scene(oc, t);
      var data = oc.getImageData(0, 0, cols, rows).data;
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
      ctx.font = "700 " + cellH + "px 'Courier New', monospace"; ctx.textBaseline = "top";
      var groups = {};
      function put(ch, c, x, y) { (groups[c] || (groups[c] = [])).push(ch, x, y); }
      var groundRow = Math.floor((oy + 97.5 * S) / cellH);
      for (var j = 0; j < rows; j++) for (var i = 0; i < cols; i++) {
        var p = (j * cols + i) * 4, a = data[p + 3] / 255;
        if (a < 0.08) {
          var h = hash(i, j);
          if (j < groundRow && h > 0.997) put(".", "rgba(220,230,255," + (0.3 + 0.4 * Math.abs(Math.sin(t * 0.7 + h * 60))).toFixed(2) + ")", i * cellW, j * cellH);
          else if (j >= groundRow && h < 0.35 - (j - groundRow) * 0.02) put(RAMP[2 + (h * 20 | 0)], "#2c3a4a", i * cellW, j * cellH);
          continue;
        }
        var r = data[p] / a, g = data[p + 1] / a, b = data[p + 2] / a;   // sin premultiplicar
        var lum = (0.3 * r + 0.55 * g + 0.15 * b) / 255 * a;
        lum = Math.min(1, lum * (0.85 + 0.3 * hash(i * 0.7, j * 1.3)));
        var k = 1 / Math.max(0.35, Math.max(r, g, b) / 255);             // colores vivos aunque sean oscuros
        var col = "rgb(" + Math.min(255, r * k * (0.45 + 0.55 * a) | 0) + "," + Math.min(255, g * k * (0.45 + 0.55 * a) | 0) + "," + Math.min(255, b * k * (0.45 + 0.55 * a) | 0) + ")";
        put(RAMP[Math.max(1, Math.min(RAMP.length - 1, (lum * (RAMP.length - 1)) | 0))], col, i * cellW, j * cellH);
      }
      hearts = hearts.filter(function (h) { return t - h.t0 < 2.6; });
      hearts.forEach(function (h) {
        var q = Math.max(0, (t - h.t0) / 2.6);
        put("♥", "rgba(255,120,150," + (1 - q).toFixed(2) + ")", h.x + Math.sin(q * 9 + h.ph) * 14, h.y - q * 160);
      });
      for (var c in groups) {
        ctx.fillStyle = c; var gr = groups[c];
        for (var m = 0; m < gr.length; m += 3) ctx.fillText(gr[m], gr[m + 1], gr[m + 2]);
      }
      flare = Math.max(0, flare - 0.008);
    }

    function loop(ms) { frame(ms / 1000); requestAnimationFrame(loop); }
    window.addEventListener("resize", resize);
    canvas.addEventListener("pointerdown", function () {
      flare = 1;
      var now = performance.now() / 1000;
      for (var i = 0; i < 8; i++) hearts.push({ x: ox + (30 + Math.random() * 40) * S, y: oy + 20 * S, t0: now + i * 0.12, ph: Math.random() * 6 });
    });
    resize();
    window.__zorro = { frame: frame, scene: scene };
    if (reduce || /debug/.test(location.search)) frame(1); else requestAnimationFrame(loop);
  </script>
</body>
</html>
