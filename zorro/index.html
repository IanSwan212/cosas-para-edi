<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Un zorro para ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" />
  <style>
    :root { --ink: #f6e7ea; --dim: rgba(246, 231, 234, 0.62); --accent: #ff9ab0; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
    header { position: fixed; top: max(20px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
      padding: 0 16px; pointer-events: none; text-shadow: 0 0 14px #000; animation: fade-in 2s ease both; }
    h1 { margin: 0; font-weight: 400; font-style: italic; font-size: clamp(22px, 3.4vw, 34px); }
    header p { margin: 6px 0 0; font-size: clamp(14px, 1.6vw, 17px); color: var(--dim); letter-spacing: 0.03em; }
    .hint { position: fixed; left: 0; right: 0; bottom: max(22px, env(safe-area-inset-bottom)); text-align: center;
      margin: 0; padding: 0 60px; font-style: italic; font-size: 17px; color: var(--dim); pointer-events: none;
      animation: fade-in 1.5s ease 3s both; }
    @keyframes fade-in { from { opacity: 0; } }
  </style>
</head>
<body>
  <canvas id="art" role="img" aria-label="Un zorro rojo elegante y estilizado, de pie y de perfil, con una cola larga que ondea entre luciérnagas, dibujado con caracteres"></canvas>
  <header>
    <h1>Un zorro para ti</h1>
    <p>Elegante, como tú</p>
  </header>
  <p class="hint">Tócalo</p>
  <script>
    // Zorro rojo estilizado (la estética alargada y elegante de las kitsune, con una sola cola),
    // de pie y de perfil, en ASCII de colores como el ramo y la luna.
    // Cada fotograma se pinta con trazos y degradados en un lienzo oculto de un píxel por celda;
    // luego cada píxel se convierte en un carácter según su brillo y con su color.
    // La cola ondea, el zorro respira, parpadea y mueve la oreja, y flotan luciérnagas;
    // al tocarlo, sacude la cola y suben corazones.
    var RAMP = " .,:;i!lI?tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
    var canvas = document.getElementById("art"), ctx = canvas.getContext("2d");
    var off = document.createElement("canvas"), oc = off.getContext("2d", { willReadFrequently: true });
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var W, H, cellW, cellH, cols, rows, S, ox, oy, flare = 0, hearts = [];

    function hash(x, y) { var h = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return h - Math.floor(h); }

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cellH = Math.max(4.5, Math.min(7, Math.min(W, H) / 150)); cellW = cellH * 0.62;
      cols = Math.ceil(W / cellW); rows = Math.ceil(H / cellH);
      off.width = cols; off.height = rows;
      // Escena en unidades: el zorro ocupa x 8..172, y −8..97 (y hacia abajo).
      S = Math.min(W / 190, (H * 0.62) / 106);
      ox = W / 2 - 90 * S; oy = H * 0.88 - 97 * S;
    }

    function bez(p, u) {
      var v = 1 - u;
      return [v * v * v * p[0] + 3 * v * v * u * p[2] + 3 * v * u * u * p[4] + u * u * u * p[6],
              v * v * v * p[1] + 3 * v * v * u * p[3] + 3 * v * u * u * p[5] + u * u * u * p[7]];
    }

    // Cola larga y esponjosa que ondea: banda a lo largo de una curva, con la punta blanca.
    function tail(c, p, wid) {
      var n = 40, L = [], R = [];
      for (var i = 0; i <= n; i++) {
        var u = i / n, a = bez(p, Math.max(0, u - 0.01)), b = bez(p, Math.min(1, u + 0.01)), m = bez(p, u);
        var tx = b[0] - a[0], ty = b[1] - a[1], tl = Math.hypot(tx, ty) || 1;
        var r = wid * Math.pow(Math.sin(Math.PI * Math.min(1, 0.08 + u * 0.9)), 0.55) * (0.55 + 0.45 * u);
        L.push([m[0] - ty / tl * r, m[1] + tx / tl * r]); R.push([m[0] + ty / tl * r, m[1] - tx / tl * r]);
      }
      c.beginPath(); c.moveTo(L[0][0], L[0][1]);
      for (i = 1; i <= n; i++) c.lineTo(L[i][0], L[i][1]);
      for (i = n; i >= 0; i--) c.lineTo(R[i][0], R[i][1]);
      c.closePath();
      var g = c.createLinearGradient(p[0], p[1], p[6], p[7]);
      g.addColorStop(0, "#9a3a14"); g.addColorStop(0.55, "#e2702c"); g.addColorStop(0.82, "#f09a52");
      g.addColorStop(0.9, "#fbe6d2"); g.addColorStop(1, "#ffffff");
      c.fillStyle = g; c.fill();
    }

    function path(c, pts) {
      c.beginPath(); c.moveTo(pts[0], pts[1]);
      for (var i = 2; i < pts.length; i += 6) c.bezierCurveTo(pts[i], pts[i + 1], pts[i + 2], pts[i + 3], pts[i + 4], pts[i + 5]);
      c.closePath();
    }

    // Pata larga y fina: tramo naranja arriba y calcetín oscuro abajo.
    function leg(c, pts, w, far) {
      c.lineCap = "round"; c.lineJoin = "round";
      c.strokeStyle = far ? "#8a3412" : "#c95a20"; c.lineWidth = w;
      c.beginPath(); c.moveTo(pts[0], pts[1]);
      for (var i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
      c.stroke();
      var n = pts.length;
      c.strokeStyle = far ? "#140806" : "#24100a"; c.lineWidth = w * 0.85;
      c.beginPath(); c.moveTo(pts[n - 4], pts[n - 3]); c.lineTo(pts[n - 2], pts[n - 1]); c.lineTo(pts[n - 2] - 3.2, pts[n - 1]); c.stroke();
    }

    function scene(c, t) {
      var breath = Math.sin(t * 1.4) * 0.5, swish = Math.sin(t * 0.9) + flare * Math.sin(t * 7) * 1.6;
      // Luciérnagas doradas que flotan despacio.
      for (var k = 0; k < 9; k++) {
        var fx = 20 + ((k * 37 + t * (2 + k % 3)) % 160), fy = 5 + 70 * hash(k, 3) + Math.sin(t * 0.7 + k) * 8;
        var fr = 0.7 + 0.5 * Math.max(0, Math.sin(t * 1.8 + k * 1.7));
        var g = c.createRadialGradient(fx, fy, 0, fx, fy, fr * 2.5);
        g.addColorStop(0, "rgba(255,240,190,1)"); g.addColorStop(0.4, "rgba(255,190,90,0.7)"); g.addColorStop(1, "rgba(255,150,60,0)");
        c.fillStyle = g; c.beginPath(); c.arc(fx, fy, fr * 2.5, 0, 7); c.fill();
      }
      // Patas del lado lejano.
      leg(c, [50, 58, 51, 78, 53, 96], 4.2, true);
      leg(c, [92, 56, 97, 72, 90, 83, 91, 96], 4.6, true);
      // Cola larga que ondea.
      tail(c, [102, 44, 126 + swish * 3, 40 - swish * 2, 132, 76 + swish * 3, 158 + swish * 4, 58 - swish * 5], 10.5);
      // Torso alargado y cuello alto.
      var gb = c.createLinearGradient(40, 30, 70, 66);
      gb.addColorStop(0, "#f39448"); gb.addColorStop(0.6, "#d0601f"); gb.addColorStop(1, "#7a2c10");
      path(c, [33, 36,
        35, 47, 41, 56 + breath, 52, 58 + breath,
        66, 60 + breath, 82, 55, 97, 55,
        107, 52, 108, 42, 100, 39,
        86, 33 - breath, 66, 37 - breath, 52, 35,
        46, 31, 44, 25, 43, 19,
        38, 22, 33, 28, 33, 36]);
      c.fillStyle = gb; c.fill();
      c.strokeStyle = "#000"; c.lineWidth = 1.1; c.stroke();
      // Pecho blanco.
      c.fillStyle = "#fbefe2";
      path(c, [33, 30, 33, 40, 36, 50, 43, 56, 44, 48, 42, 40, 40, 30, 37, 27, 34, 27, 33, 30]); c.fill();
      // Patas del lado cercano.
      leg(c, [44, 54, 43, 76, 41, 96], 4.6, false);
      leg(c, [98, 52, 104, 70, 97, 82, 98, 96], 5, false);
      // Cabeza erguida, hocico largo y orejas altas.
      var nod = Math.sin(t * 0.6) * 0.8, twitch = Math.max(0, Math.sin(t * 0.8) - 0.95) * 30;
      c.save(); c.translate(38, 20); c.rotate(nod * 0.03); c.translate(-38, -20 + breath * 0.5);
      c.strokeStyle = "#000"; c.lineWidth = 1;
      c.fillStyle = "#3a160b";
      path(c, [43, 11, 44, 5, 46, 0, 48, -6 - twitch * 0.1, 50, 2, 50, 8, 49, 14, 47, 13, 45, 12, 43, 11]); c.stroke(); c.fill();
      var gh = c.createLinearGradient(14, 8, 46, 28);
      gh.addColorStop(0, "#f6a35a"); gh.addColorStop(1, "#bf4c1b");
      c.fillStyle = gh;
      path(c, [46, 18, 46, 10, 41, 7, 35, 9,
        29, 11, 21, 15, 12, 19,
        11, 21, 17, 23, 24, 23,
        28, 26, 32, 28, 37, 28,
        43, 27, 46, 23, 46, 18]);
      c.stroke(); c.fill();
      c.fillStyle = "#d8662a";
      path(c, [36, 10, 36, 4, 38, -2, 40, -8, 43, -1, 44, 5, 44, 11, 41, 10, 38, 10, 36, 10]); c.stroke(); c.fill();
      c.fillStyle = "#f3d9c2";
      path(c, [38, 9, 38, 4, 39, 0, 40, -4, 42, 1, 42, 5, 42, 9, 41, 9, 39, 9, 38, 9]); c.fill();
      // Mejilla y mandíbula blancas.
      c.fillStyle = "#fbefe2";
      path(c, [12, 20, 17, 22, 24, 22, 29, 23, 34, 25, 40, 26, 44, 24, 40, 30, 32, 30, 26, 27, 18, 24, 12, 20]); c.fill();
      // Nariz.
      c.fillStyle = "#120806"; c.beginPath(); c.ellipse(11.8, 19.6, 1.6, 1.2, 0.3, 0, 7); c.fill();
      // Ojo rasgado y sereno (parpadea).
      var blink = (t % 5.3) < 0.15 ? 0.15 : 1;
      c.save(); c.translate(28, 13.5); c.rotate(-0.3);
      c.fillStyle = "#1a0b06"; c.beginPath(); c.ellipse(0, 0, 3.2, 1.2 * blink, 0, 0, 7); c.fill();
      if (blink === 1) {
        c.fillStyle = "#f2b630"; c.beginPath(); c.ellipse(0.4, 0, 1.8, 0.85, 0, 0, 7); c.fill();
        c.fillStyle = "#ffffff"; c.beginPath(); c.arc(-0.2, -0.3, 0.4, 0, 7); c.fill();
      }
      c.restore();
      c.restore();
    }

    function frame(t) {
      oc.setTransform(1, 0, 0, 1, 0, 0); oc.clearRect(0, 0, cols, rows);
      oc.setTransform(S / cellW, 0, 0, S / cellH, ox / cellW, oy / cellH);
      scene(oc, t);
      var data = oc.getImageData(0, 0, cols, rows).data;
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
      ctx.font = "700 " + cellH + "px 'Courier New', monospace"; ctx.textBaseline = "top";
      var groups = {};
      function put(ch, c, x, y) { (groups[c] || (groups[c] = [])).push(ch, x, y); }
      var groundRow = Math.floor((oy + 97.5 * S) / cellH);
      for (var j = 0; j < rows; j++) for (var i = 0; i < cols; i++) {
        var p = (j * cols + i) * 4, a = data[p + 3] / 255;
        if (a < 0.08) {
          var h = hash(i, j);
          if (j < groundRow && h > 0.997) put(".", "rgba(220,230,255," + (0.3 + 0.4 * Math.abs(Math.sin(t * 0.7 + h * 60))).toFixed(2) + ")", i * cellW, j * cellH);
          else if (j >= groundRow && h < 0.35 - (j - groundRow) * 0.02) put(RAMP[2 + (h * 20 | 0)], "#3a2a1a", i * cellW, j * cellH);
          continue;
        }
        var r = data[p] / a, g = data[p + 1] / a, b = data[p + 2] / a;   // sin premultiplicar
        var lum = (0.3 * r + 0.55 * g + 0.15 * b) / 255 * a;
        lum = Math.min(1, lum * (0.85 + 0.3 * hash(i * 0.7, j * 1.3)));
        var k = 1 / Math.max(0.35, Math.max(r, g, b) / 255);             // colores vivos aunque sean oscuros
        var col = "rgb(" + Math.min(255, r * k * (0.45 + 0.55 * a) | 0) + "," + Math.min(255, g * k * (0.45 + 0.55 * a) | 0) + "," + Math.min(255, b * k * (0.45 + 0.55 * a) | 0) + ")";
        put(RAMP[Math.max(1, Math.min(RAMP.length - 1, (lum * (RAMP.length - 1)) | 0))], col, i * cellW, j * cellH);
      }
      hearts = hearts.filter(function (h) { return t - h.t0 < 2.6; });
      hearts.forEach(function (h) {
        var q = Math.max(0, (t - h.t0) / 2.6);
        put("♥", "rgba(255,120,150," + (1 - q).toFixed(2) + ")", h.x + Math.sin(q * 9 + h.ph) * 14, h.y - q * 160);
      });
      for (var c in groups) {
        ctx.fillStyle = c; var gr = groups[c];
        for (var m = 0; m < gr.length; m += 3) ctx.fillText(gr[m], gr[m + 1], gr[m + 2]);
      }
      flare = Math.max(0, flare - 0.008);
    }

    function loop(ms) { frame(ms / 1000); requestAnimationFrame(loop); }
    window.addEventListener("resize", resize);
    canvas.addEventListener("pointerdown", function () {
      flare = 1;
      var now = performance.now() / 1000;
      for (var i = 0; i < 8; i++) hearts.push({ x: ox + (20 + Math.random() * 30) * S, y: oy + 5 * S, t0: now + i * 0.12, ph: Math.random() * 6 });
    });
    resize();
    window.__zorro = { frame: frame, scene: scene };
    if (reduce || /debug/.test(location.search)) frame(1); else requestAnimationFrame(loop);
  </script>
</body>
</html>
