<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Un zorro para ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" />
  <style>
    :root { --ink: #f6e7ea; --dim: rgba(246, 231, 234, 0.62); --accent: #ff9ab0; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
    header { position: fixed; top: max(20px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
      padding: 0 16px; pointer-events: none; text-shadow: 0 0 14px #000; animation: fade-in 2s ease both; }
    h1 { margin: 0; font-weight: 400; font-style: italic; font-size: clamp(22px, 3.4vw, 34px); }
    header p { margin: 6px 0 0; font-size: clamp(14px, 1.6vw, 17px); color: var(--dim); letter-spacing: 0.03em; }
    .hint { position: fixed; left: 0; right: 0; bottom: max(22px, env(safe-area-inset-bottom)); text-align: center;
      margin: 0; padding: 0 60px; font-style: italic; font-size: 17px; color: var(--dim); pointer-events: none;
      animation: fade-in 1.5s ease 3s both; }
    @keyframes fade-in { from { opacity: 0; } }
  </style>
</head>
<body>
  <canvas id="art" role="img" aria-label="Un zorro rojo esponjoso que se sienta en el pasto, mira al cielo y luego voltea hacia ti, con la cola enroscada, dibujado con caracteres"></canvas>
  <header>
    <h1>Un zorro para ti</h1>
    <p>Mirándote, pensando en ti</p>
  </header>
  <p class="hint">Acarícialo · toca su cola · toca el cielo</p>
  <script>
    // Zorro rojo suave y esponjoso, sentado de espaldas en el pasto y mirando hacia arriba con los ojos
    // cerrados, con la cola enroscada por delante; en ASCII de colores como el ramo y la luna.
    // Cada fotograma se pinta con trazos y degradados en un lienzo oculto de un píxel por celda;
    // luego cada píxel se convierte en un carácter según su brillo y con su color.
    // Respira, mece la cabeza, mueve la punta de la cola y la oreja; el pasto se mece y flotan luciérnagas.
    // Al tocarlo, levanta un poco más la cabeza, sacude la cola y suben corazones.
    var RAMP = " .'`,:;\"^~-_+=<>il!/\|()1{}[]?tfjrxnuvczXYUJCLQ0Ozmwqpdbkhao*#";
    var canvas = document.getElementById("art"), ctx = canvas.getContext("2d");
    var off = document.createElement("canvas"), oc = off.getContext("2d", { willReadFrequently: true });
    var W, H, cellW, cellH, cols, rows, S, ox, oy, flare = 0, hearts = [], t0 = null, lastHeart = 0;
    var look = { x: 0, y: 0 }, lookT = { x: 0, y: 0 }, pet = 0, petting = false, rub = 0, toy = null;

    function hash(x, y) { var h = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return h - Math.floor(h); }

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cellH = Math.max(3.6, Math.min(5.5, Math.min(W, H) / 190)); cellW = cellH * 0.62;
      cols = Math.ceil(W / cellW); rows = Math.ceil(H / cellH);
      off.width = cols; off.height = rows;
      // Escena en unidades: el zorro ocupa x 15..95, y 8..114 (y hacia abajo).
      S = Math.min(W / 125, (H * 0.68) / 108);
      ox = W / 2 - 55 * S; oy = H * 0.92 - 114 * S;
    }

    function path(c, pts) {
      c.beginPath(); c.moveTo(pts[0], pts[1]);
      for (var i = 2; i < pts.length; i += 6) c.bezierCurveTo(pts[i], pts[i + 1], pts[i + 2], pts[i + 3], pts[i + 4], pts[i + 5]);
      c.closePath();
    }

    // Pelaje suave: rellena y además dibuja un borde de mechones cortos para que se vea esponjoso.
    function fluffy(c, fill, edge) {
      c.fillStyle = fill; c.fill();
      if (edge) { c.strokeStyle = edge; c.lineWidth = 1.4; c.setLineDash([0.9, 1.1]); c.stroke(); c.setLineDash([]); }
    }

    function scene(c, t) {
      var breath = Math.sin(t * 1.3) * 0.7;
      var flick = Math.sin(t * 1.1) * 1.5 + flare * Math.sin(t * 9) * 3;
      // Luciérnagas doradas.
      for (var k = 0; k < 8; k++) {
        var fx = 5 + ((k * 29 + t * (1.5 + k % 3)) % 110), fy = 10 + 70 * hash(k, 5) + Math.sin(t * 0.6 + k) * 6;
        var fr = 0.6 + 0.5 * Math.max(0, Math.sin(t * 1.7 + k * 1.9));
        var g = c.createRadialGradient(fx, fy, 0, fx, fy, fr * 2.6);
        g.addColorStop(0, "rgba(255,240,190,1)"); g.addColorStop(0.4, "rgba(255,190,90,0.7)"); g.addColorStop(1, "rgba(255,150,60,0)");
        c.fillStyle = g; c.beginPath(); c.arc(fx, fy, fr * 2.6, 0, 7); c.fill();
      }
      // Luciérnaga que dejó Edi al tocar el cielo: el zorro la mira.
      if (toy) {
        var ta = t - toy.t0, tf = Math.max(0, 1 - ta / 4), tyy = toy.y - ta * 2;
        var tg = c.createRadialGradient(toy.x, tyy, 0, toy.x, tyy, 5);
        tg.addColorStop(0, "rgba(255,245,200," + tf + ")"); tg.addColorStop(0.4, "rgba(255,200,90," + (0.8 * tf) + ")"); tg.addColorStop(1, "rgba(255,150,60,0)");
        c.fillStyle = tg; c.beginPath(); c.arc(toy.x, tyy, 5, 0, 7); c.fill();
      }
      // Pasto suave.
      c.lineCap = "round";
      for (var i = 0; i < 70; i++) {
        var gx = 10 + i * 1.3 + hash(i, 1) * 2, gh = 3 + hash(i, 2) * 6, sw = Math.sin(t * 1.2 + i * 0.4) * 1.2;
        c.strokeStyle = i % 3 ? "#7fa83a" : "#a9c95a"; c.lineWidth = 0.8;
        c.beginPath(); c.moveTo(gx, 114); c.quadraticCurveTo(gx + sw * 0.5, 114 - gh * 0.6, gx + sw, 114 - gh); c.stroke();
      }
      // Entrada: el zorro salta hacia arriba en su sitio, aterriza con suavidad, se acomoda,
      // mira al cielo y luego voltea hacia el frente.
      if (t0 == null) t0 = t;
      var intro = window.__zorro && window.__zorro.intro != null ? window.__zorro.intro : Math.min(1, (t - t0) / 6.5);
      // Una sola toma: el zorro se dibuja entero en un lienzo aparte y luego se dobla a lo largo de su
      // columna, franja por franja. Así se agacha, salta en arco (se inclina hacia delante y arquea la
      // espalda como un zorro que se lanza), cae, se aplasta un poco y vuelve a sentarse sin cambiar de dibujo.
      var crouch = smooth(0.02, 0.1, intro) * (1 - smooth(0.1, 0.14, intro));
      var jump = smooth(0.1, 0.38, intro), land = smooth(0.36, 0.5, intro), turn = smooth(0.7, 0.76, intro), turnRot = smooth(0.52, 0.72, intro);
      var airborne = Math.sin(Math.PI * jump), vel = jump > 0 && jump < 1 ? Math.cos(Math.PI * jump) : 0;
      var squash = Math.sin(Math.PI * land) * (1 - land) * 1.3 + crouch * 0.7;
      pose = { lift: airborne * 26, dx: airborne * 14, rot: -airborne * 0.5 + vel * airborne * 0.2,
        arch: -airborne * 0.009, sx: 1 + squash * 0.16 - airborne * 0.06, sy: 1 - squash * 0.2 + airborne * 0.08,
        alpha: Math.min(1, intro * 12) };
      flick += vel * airborne * -8;                                       // la cola se queda atrás
      var stage = c; c = sctx;
      sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.clearRect(0, 0, spr.width, spr.height);
      sctx.setTransform(SR, 0, 0, SR, 0, 0); c.save();
      flick += (1 - land) * Math.sin(t * 5) * 3;
      // Cuerpo sentado, de espaldas en tres cuartos, redondo como una pera.
      c.save(); c.translate(55, 108); c.scale(1 + breath * 0.008, 1 - breath * 0.006); c.translate(-55, -108);
      var gb = c.createLinearGradient(40, 40, 78, 100);
      gb.addColorStop(0, "#f7a03c"); gb.addColorStop(0.55, "#ee8a24"); gb.addColorStop(1, "#b5571a");
      path(c, [44, 40,
        56, 40, 66, 50, 72, 64,
        78, 76, 80, 92, 74, 102,
        66, 110, 50, 110, 42, 102,
        36, 92, 36, 70, 38, 56,
        39, 48, 40, 42, 44, 40]);
      fluffy(c, gb, "#c96a1c");
      // Pecho blanco, del lado izquierdo, desde la garganta.
      path(c, [37, 26, 42, 30, 45, 40, 44, 52,
        43, 64, 42, 76, 44, 84,
        38, 82, 34, 70, 34, 56,
        34, 44, 34, 32, 37, 26]);
      fluffy(c, "#fbf3ea", "#e8dccd");
      // Sombra cálida bajo la espalda.
      var gs = c.createRadialGradient(64, 96, 2, 64, 96, 22);
      gs.addColorStop(0, "rgba(120,50,15,0.55)"); gs.addColorStop(1, "rgba(120,50,15,0)");
      c.fillStyle = gs; c.beginPath(); c.arc(64, 96, 22, 0, 7); c.fill();
      c.restore();
      // Cola enroscada por delante, con la punta blanca que se mueve.
      // La punta termina en pico, como la cola de un zorro.
      var tx = 13 - flick * 0.7, ty = 93 + flick * 0.4;
      path(c, [76, 100,
        78, 110, 60, 116, 44, 115,
        32, 114, 22, 106, tx, ty,
        24, 92, 32, 86, 42, 92,
        50, 99, 66, 98, 76, 100]);
      var gt = c.createLinearGradient(76, 104, tx, ty);
      gt.addColorStop(0, "#7a3410"); gt.addColorStop(0.45, "#a9521a"); gt.addColorStop(0.62, "#d98b4a");
      gt.addColorStop(0.72, "#fbf3ea"); gt.addColorStop(1, "#ffffff");
      fluffy(c, gt, "#5a2a10");
      // Manitas: asoman bajo el pecho mientras está en el aire.
      if (airborne > 0.05) {
        c.save(); c.globalAlpha *= Math.min(1, airborne * 3);
        for (var pw = 0; pw < 2; pw++) {
          var pxx = 41 + pw * 7, pyy = 103 + airborne * 5 + Math.sin(t * 10 + pw) * 0.6;
          c.fillStyle = "#e2781f"; c.beginPath(); c.ellipse(pxx, pyy - 3, 2.6, 4, 0, 0, 7); c.fill();
          c.fillStyle = "#2a120a"; c.beginPath(); c.ellipse(pxx, pyy + 1, 2.4, 1.8, 0, 0, 7); c.fill();
        }
        c.restore();
      }
      // Cabeza mirando hacia arriba, ojos cerrados y contentos; se mece despacio.
      var tilt = Math.sin(t * 0.5) * 0.05 - flare * 0.08;
      c.save(); c.globalAlpha *= 1 - turn; c.translate(48, 40); c.rotate(tilt + turnRot * 0.75); c.translate(-48, -40);
      var gh = c.createLinearGradient(40, 12, 62, 40);
      gh.addColorStop(0, "#fbb04c"); gh.addColorStop(1, "#e47c1e");
      path(c, [46, 9,
        52, 12, 58, 20, 62, 30,
        64, 36, 60, 42, 52, 42,
        46, 42, 40, 38, 38, 30,
        37, 24, 40, 16, 43, 12,
        44, 10, 45, 9, 46, 9]);
      fluffy(c, gh, "#d26f1c");
      // Garganta blanca bajo el hocico.
      path(c, [43, 13, 42, 20, 42, 28, 45, 36, 41, 37, 37, 32, 37, 26, 38, 20, 41, 15, 43, 13]);
      fluffy(c, "#fbf3ea", null);
      // Nariz en la punta del hocico.
      c.fillStyle = "#1a0b06"; c.beginPath(); c.ellipse(46.5, 9.6, 1.5, 1.1, 0.6, 0, 7); c.fill();
      // Ojo cerrado: un arco tranquilo.
      c.strokeStyle = "#2a120a"; c.lineWidth = 0.9;
      c.beginPath(); c.moveTo(49, 20); c.quadraticCurveTo(51.5, 22.5, 54, 21); c.stroke();
      // Oreja de atrás: negra con interior claro; a veces se mueve.
      var tw = Math.max(0, Math.sin(t * 0.7) - 0.93) * 40;
      c.save(); c.translate(58, 34); c.rotate(tw * 0.01);
      c.fillStyle = "#1a0d08";
      path(c, [-4, -3, 0, -2, 6, 4, 9, 13, 3, 12, -3, 8, -6, 4, -6, 0, -5, -2, -4, -3]); c.fill();
      c.fillStyle = "#f3e6da";
      path(c, [-3, 0, 0, 1, 4, 6, 6, 11, 2, 10, -1, 7, -3, 4, -4, 2, -4, 1, -3, 0]); c.fill();
      c.restore();
      c.restore();
      if (turn > 0) frontHead(c, t, turn, smooth(0.7, 0.9, intro));
      c.restore();
      c = stage; bend(c, pose);
      // Corazoncitos que suben del zorro (también se vuelven ASCII).
      hearts = hearts.filter(function (h) { return t - h.t0 < h.life; });
      hearts.forEach(function (h) {
        var q = (t - h.t0) / h.life;
        if (q < 0) return;
        var hx = h.x + Math.sin(q * 6 + h.ph) * 3, hy = h.y - q * h.rise, r = h.size * (0.6 + 0.4 * Math.min(1, q * 5));
        c.save(); c.globalAlpha = Math.min(1, q * 6) * (1 - q); c.translate(hx, hy); c.rotate(Math.sin(q * 5 + h.ph) * 0.25);
        c.fillStyle = h.col; c.beginPath(); c.moveTo(0, r * 0.35);
        c.bezierCurveTo(-r * 1.1, -r * 0.45, -r * 0.45, -r * 1.15, 0, -r * 0.45);
        c.bezierCurveTo(r * 0.45, -r * 1.15, r * 1.1, -r * 0.45, 0, r * 0.35); c.fill();
        c.restore();
      });
      if (intro > 0.95 && t - lastHeart > 1.1) { lastHeart = t; addHeart(40 + Math.random() * 24, 14, t, 1); }
    }

    // Dibuja el zorro del lienzo aparte doblándolo por franjas a lo largo de una columna curva que
    // nace en el suelo (x 55, y 118): rot inclina la columna y arch la curva.
    var SR = 3, SPW = 120, SPH = 120, spr = document.createElement("canvas"), sctx = spr.getContext("2d"), pose;
    spr.width = SPW * SR; spr.height = SPH * SR;
    function bend(c, ps) {
      var N = 70, hs = 118 / N, step = hs * ps.sy;
      var px = 55 + ps.dx, py = 118 - ps.lift, ang = -Math.PI / 2 + ps.rot;
      c.save(); c.globalAlpha = ps.alpha;
      for (var i = 0; i < N; i++) {
        var sy = 118 - (i + 1) * hs;
        c.save(); c.translate(px, py); c.rotate(ang + Math.PI / 2); c.scale(ps.sx, 1);
        c.drawImage(spr, 0, sy * SR, SPW * SR, hs * SR + 1, -55, -step - 0.6, SPW, step + 1.2);
        c.restore();
        px += Math.cos(ang) * step; py += Math.sin(ang) * step; ang += ps.arch * step;
      }
      c.restore();
    }

    function smooth(a, b, x) { var u = Math.max(0, Math.min(1, (x - a) / (b - a))); return u * u * (3 - 2 * u); }

    // Cara de frente, como la foto: mejillas esponjosas, hocico blanco, ojos ámbar y sonrisa.
    function frontHead(c, t, turn, fin) {
      var cx = 51 + look.x * 2.5, cy = 30 + look.y * 1.5;
      var tilt = Math.sin(t * 0.7) * 0.05 + (1 - fin) * -0.35 + look.x * 0.12 + pet * 0.2;
      c.save(); c.globalAlpha *= turn; c.translate(cx, cy + (1 - fin) * -4); c.rotate(tilt);
      // Orejas con punta negra e interior claro.
      for (var s = -1; s <= 1; s += 2) {
        var tw = s === 1 ? Math.max(0, Math.sin(t * 0.7) - 0.93) * 0.6 : 0;
        c.save(); c.scale(s, 1); c.rotate(-tw + pet * 0.3);
        c.fillStyle = "#e9842a"; path(c, [5, -9, 8, -14, 12, -20, 15, -24, 17, -16, 16, -8, 14, -3, 10, -5, 7, -7, 5, -9]); c.fill();
        c.fillStyle = "#1a0d08"; path(c, [13, -19, 14, -21, 15, -23, 15, -24, 16.5, -20, 16.6, -17, 16.4, -15, 15, -16, 14, -17, 13, -19]); c.fill();
        c.fillStyle = "#f6e2cc"; path(c, [8, -9, 10, -13, 12, -17, 14, -19, 15, -14, 14, -9, 13, -6, 11, -7, 9, -8, 8, -9]); c.fill();
        c.restore();
      }
      // Cabeza redonda y esponjosa.
      var gh = c.createRadialGradient(-3, -6, 2, 0, 0, 18);
      gh.addColorStop(0, "#fbb459"); gh.addColorStop(0.7, "#ef8d2c"); gh.addColorStop(1, "#d06d1c");
      path(c, [0, -13, 10, -13, 17, -6, 17, 3,
        17, 9, 13, 13, 7, 14,
        3, 15, -3, 15, -7, 14,
        -13, 13, -17, 9, -17, 3,
        -17, -6, -10, -13, 0, -13]);
      fluffy(c, gh, "#d26f1c");
      // Mejillas y hocico blancos.
      path(c, [0, 1, 6, 1, 13, 4, 16, 8, 12, 14, 6, 16, 0, 16, -6, 16, -12, 14, -16, 8, -13, 4, -6, 1, 0, 1]);
      fluffy(c, "#fbf3ea", "#e8dccd");
      // Ojos cerrados y felices (como arquitos) y rubor que crece al acariciarlo.
      for (s = -1; s <= 1; s += 2) {
        c.fillStyle = "rgba(255,130,150," + (0.35 + 0.55 * pet).toFixed(2) + ")";
        c.beginPath(); c.ellipse(s * 9.5, 4, 2.6, 1.6, 0, 0, 7); c.fill();
        c.save(); c.translate(s * 7 + look.x * 0.8, -2 + look.y * 0.5);
        c.strokeStyle = "#2a120a"; c.lineWidth = 1.2 + pet * 0.3; c.lineCap = "round";
        c.beginPath(); c.moveTo(-2.6, 0.8); c.quadraticCurveTo(0, -2 - pet * 0.6, 2.6, 0.8); c.stroke();
        c.restore();
      }
      // Nariz y sonrisa.
      c.fillStyle = "#120806"; c.beginPath(); c.ellipse(0, 5.5, 2.2, 1.7, 0, 0, 7); c.fill();
      c.fillStyle = "#ffffff"; c.beginPath(); c.arc(-0.7, 4.9, 0.5, 0, 7); c.fill();
      c.strokeStyle = "#3a1a0e"; c.lineWidth = 0.7; c.lineCap = "round";
      c.beginPath(); c.moveTo(0, 7.2); c.lineTo(0, 8.6); c.quadraticCurveTo(-2.5, 10.5, -4.5, 9); c.moveTo(0, 8.6); c.quadraticCurveTo(2.5, 10.5, 4.5, 9); c.stroke();
      c.restore();
    }

    function frame(t) {
      oc.setTransform(1, 0, 0, 1, 0, 0); oc.clearRect(0, 0, cols, rows);
      oc.setTransform(S / cellW, 0, 0, S / cellH, ox / cellW, oy / cellH);
      scene(oc, t);
      var data = oc.getImageData(0, 0, cols, rows).data;
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
      ctx.font = "500 " + cellH + "px 'Courier New', monospace"; ctx.textBaseline = "top";
      var groups = {};
      function put(ch, c, x, y) { (groups[c] || (groups[c] = [])).push(ch, x, y); }
      var groundRow = Math.floor((oy + 114.5 * S) / cellH);
      for (var j = 0; j < rows; j++) for (var i = 0; i < cols; i++) {
        var p = (j * cols + i) * 4, a = data[p + 3] / 255;
        if (a < 0.08) {
          var h = hash(i, j);
          if (j < groundRow && h > 0.997) put(".", "rgba(220,230,255," + (0.3 + 0.4 * Math.abs(Math.sin(t * 0.7 + h * 60))).toFixed(2) + ")", i * cellW, j * cellH);
          
          continue;
        }
        var r = data[p] / a, g = data[p + 1] / a, b = data[p + 2] / a;   // sin premultiplicar
        var lum = (0.3 * r + 0.55 * g + 0.15 * b) / 255 * a;
        lum = Math.min(1, lum * (0.85 + 0.3 * hash(i * 0.7, j * 1.3)));
        var k = 1 / Math.max(0.35, Math.max(r, g, b) / 255);             // colores vivos aunque sean oscuros
        var col = "rgb(" + Math.min(255, r * k * (0.45 + 0.55 * a) | 0) + "," + Math.min(255, g * k * (0.45 + 0.55 * a) | 0) + "," + Math.min(255, b * k * (0.45 + 0.55 * a) | 0) + ")";
        put(RAMP[Math.max(1, Math.min(RAMP.length - 1, (lum * (RAMP.length - 1)) | 0))], col, i * cellW, j * cellH);
      }
      for (var c in groups) {
        ctx.fillStyle = c; var gr = groups[c];
        for (var m = 0; m < gr.length; m += 3) ctx.fillText(gr[m], gr[m + 1], gr[m + 2]);
      }
      flare = Math.max(0, flare - 0.008);
      // Hacia dónde mira: la luciérnaga, el puntero o un vaivén suave.
      if (toy && t - toy.t0 > 4) toy = null;
      var tx = lookT.x, ty = lookT.y;
      if (toy) { tx = clamp((toy.x - 51) / 30); ty = clamp((toy.y - (t - toy.t0) * 2 - 30) / 30); }
      look.x += (tx - look.x) * 0.06; look.y += (ty - look.y) * 0.06;
      pet += ((petting ? 1 : 0) - pet) * 0.05;
    }

    function loop(ms) { frame(ms / 1000); requestAnimationFrame(loop); }
    window.addEventListener("resize", resize);
    function clamp(v) { return Math.max(-1, Math.min(1, v)); }
    function units(e) { return { x: (e.clientX - ox) / S, y: (e.clientY - oy) / S }; }
    var HEART_COLORS = ["#ff7a9a", "#ff9ab0", "#ff5c86", "#ffc2d1"];
    function addHeart(x, y, t, size) {
      hearts.push({ x: x, y: y, t0: t, ph: Math.random() * 6, life: 2.6 + Math.random(), rise: 26 + Math.random() * 14,
        size: (2.4 + Math.random() * 1.4) * size, col: HEART_COLORS[(Math.random() * 4) | 0] });
    }
    function heartsAt(n, x, y) {
      var now = performance.now() / 1000, u = units({ clientX: x, clientY: y });
      for (var i = 0; i < n; i++) addHeart(u.x + (Math.random() - 0.5) * 12, u.y, now + i * 0.12, 1.3);
    }
    // Mirarte, dejarse acariciar (pasar el dedo o el ratón por su cabeza), mover la cola y seguir luciérnagas.
    window.addEventListener("pointermove", function (e) {
      var u = units(e);
      lookT.x = clamp((u.x - 51) / 40); lookT.y = clamp((u.y - 30) / 40);
      var wasPetting = petting;
      petting = Math.hypot(u.x - 51, u.y - 30) < 18;
      if (petting && wasPetting) {
        rub += Math.hypot(e.movementX || 0, e.movementY || 0);
        if (rub > 60) { rub = 0; heartsAt(1, e.clientX, e.clientY - 10); }
      }
    });
    window.addEventListener("pointerleave", function () { petting = false; lookT.x = lookT.y = 0; });
    canvas.addEventListener("pointerup", function (e) { if (e.pointerType !== "mouse") { petting = false; } });
    canvas.addEventListener("pointerdown", function (e) {
      var u = units(e);
      if (Math.hypot(u.x - 51, u.y - 30) < 18) { petting = true; pet = 1; heartsAt(6, e.clientX, e.clientY - 20); }
      else if (u.y > 84 && u.y < 118 && u.x > 15 && u.x < 85) { flare = 1; heartsAt(3, e.clientX, e.clientY - 10); }
      else toy = { x: u.x, y: u.y, t0: performance.now() / 1000 };
    });
    resize();
    window.__zorro = { frame: frame, scene: scene, intro: null };
    // Siempre se anima (son movimientos suaves), aunque el sistema tenga reducidas las animaciones.
    if (/debug/.test(location.search)) frame(1); else requestAnimationFrame(loop);
  </script>
</body>
