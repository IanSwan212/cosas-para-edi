<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Un zorrito para ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" />
  <style>
    :root { --ink: #f6e7ea; --dim: rgba(246, 231, 234, 0.62); --accent: #ff9ab0; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
    header { position: fixed; top: max(20px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
      padding: 0 16px; pointer-events: none; text-shadow: 0 0 14px #000; animation: fade-in 2s ease both; }
    h1 { margin: 0; font-weight: 400; font-style: italic; font-size: clamp(22px, 3.4vw, 34px); }
    header p { margin: 6px 0 0; font-size: clamp(14px, 1.6vw, 17px); color: var(--dim); letter-spacing: 0.03em; }
    .hint { position: fixed; left: 0; right: 0; bottom: max(22px, env(safe-area-inset-bottom)); text-align: center;
      margin: 0; padding: 0 60px; font-style: italic; font-size: 17px; color: var(--dim); pointer-events: none;
      animation: fade-in 1.5s ease 3s both; }
    @keyframes fade-in { from { opacity: 0; } }
  </style>
</head>
<body>
  <canvas id="art" role="img" aria-label="Un zorro rojo sentado entre hojas de otoño, dibujado con caracteres, que mueve la cola y parpadea"></canvas>
  <header>
    <h1>Un zorrito para ti</h1>
    <p>Hoja por hoja, como este otoño contigo</p>
  </header>
  <p class="hint">Tócalo</p>
  <script>
    // Zorro rojo sentado de frente, en ASCII de colores como el ramo y la luna.
    // Cada celda de la rejilla evalúa qué parte del zorro cae ahí (formas elípticas), le da luz
    // desde arriba a la izquierda y elige un carácter según el brillo. Anima la cola, el parpadeo,
    // las orejas y la respiración; mira hacia el puntero y, al tocarlo, mueve la cola y suelta corazones.
    var RAMP = " .,:;i!lI?tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
    var canvas = document.getElementById("art"), ctx = canvas.getContext("2d");
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var look = { x: 0, y: 0 }, lookT = { x: 0, y: 0 }, wag = 0, hearts = [], leaves = [];
    var W, H, cellW, cellH, cols, rows, scale, cx, cy;

    function hash(x, y) { var h = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return h - Math.floor(h); }
    function ell(x, y, ex, ey, rx, ry) { var a = (x - ex) / rx, b = (y - ey) / ry; return a * a + b * b; }
    function tri(px, py, ax, ay, bx, by, qx, qy) {
      var d1 = (px - bx) * (ay - by) - (ax - bx) * (py - by), d2 = (px - qx) * (by - qy) - (bx - qx) * (py - qy),
          d3 = (px - ax) * (qy - ay) - (qx - ax) * (py - ay);
      return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
    }

    var ORANGE = [236, 112, 38], CREAM = [252, 236, 214], DARK = [58, 30, 22], BLACK = [18, 10, 10], PINK = [255, 150, 170];

    // Devuelve [color, brillo base, normal aproximada nx, ny] o null si la celda está vacía.
    function fox(x, y, t) {
      var breath = Math.sin(t * 1.6) * 0.012;
      var hx = look.x * 0.06, hy = look.y * 0.03 + breath;            // la cabeza sigue al puntero
      var blink = (t % 4.3) < 0.14 ? 0.12 : 1;
      var twitch = Math.max(0, Math.sin(t * 0.9) - 0.96) * 6;           // de vez en cuando
      // Ojos y nariz encima de todo.
      var ex = 0.12, ey = 0.31 + hy;
      for (var s = -1; s <= 1; s += 2) {
        var e = ell(x, y, s * ex + hx * 1.3, ey, 0.06, 0.042 * blink);
        if (e < 1) {
          var g = ell(x, y, s * ex + hx * 1.3 - 0.015, ey + 0.012, 0.016, 0.016);
          return g < 1 && blink === 1 ? [CREAM, 1, 0, 0] : [BLACK, 0.12, 0, 0];
        }
      }
      if (ell(x, y, hx * 1.6, 0.15 + hy, 0.045, 0.032) < 1) return [BLACK, 0.18, 0, 1];
      // Rubor.
      for (s = -1; s <= 1; s += 2) if (ell(x, y, s * 0.2 + hx, 0.2 + hy, 0.05, 0.03) < 1) return [PINK, 0.75, 0, 0];
      // Hocico y mejillas blancas.
      if (ell(x, y, hx * 1.4, 0.16 + hy, 0.11, 0.09) < 1 ||
          ell(x, y, -0.15 + hx, 0.19 + hy, 0.17, 0.11) < 1 || ell(x, y, 0.15 + hx, 0.19 + hy, 0.17, 0.11) < 1)
        return [CREAM, 0.95, (x - hx) * 2, (y - 0.2 - hy) * 3];
      // Orejas (borde oscuro, interior crema).
      for (s = -1; s <= 1; s += 2) {
        var tw = s === 1 ? twitch : 0;
        var ax = s * (0.32 + tw * 0.05) + hx, ay = 0.78 + hy - tw * 0.04;
        var bx = s * 0.08 + hx, by = 0.46 + hy, qx = s * 0.37 + hx, qy = 0.36 + hy;
        if (tri(x, y, ax, ay, bx, by, qx, qy)) {
          var mx = (ax + bx + qx) / 3, my = (ay + by + qy) / 3;
          var inner = tri(x, y, mx + (ax - mx) * 0.62, my + (ay - my) * 0.62, mx + (bx - mx) * 0.62,
            my + (by - my) * 0.62, mx + (qx - mx) * 0.62, my + (qy - my) * 0.62);
          if (inner) return [CREAM, 0.7, 0, 0];
          return y > ay - 0.1 ? [DARK, 0.4, s, 1] : [ORANGE, 0.85, s * 0.5, 0.5];
        }
      }
      // Cabeza.
      var hd = ell(x, y, hx, 0.29 + hy, 0.35, 0.27);
      if (hd < 1) return [ORANGE, 0.9, (x - hx) / 0.35, (y - 0.29 - hy) / 0.27];
      for (s = -1; s <= 1; s += 2)
        if (tri(x, y, s * 0.4 + hx, 0.14 + hy, s * 0.24 + hx, 0.27 + hy, s * 0.14 + hx, 0.1 + hy)) return [CREAM, 0.92, s, -0.3];
      // Patas delanteras con calcetines oscuros.
      for (s = -1; s <= 1; s += 2) {
        if (Math.abs(x - s * 0.11) < 0.065 && y > -0.86 && y < -0.4) return [y < -0.66 ? DARK : ORANGE, y < -0.66 ? 0.45 : 0.8, s * 0.3, 0];
        if (ell(x, y, s * 0.12, -0.86, 0.085, 0.045) < 1) return [DARK, 0.4, 0, 1];
      }
      // Pecho.
      if (ell(x, y, 0, -0.18 + breath, 0.17, 0.3) < 1) return [CREAM, 0.95, x / 0.17, 0];
      // Cuerpo.
      var bd = ell(x, y, 0, -0.42 + breath, 0.38 + breath, 0.46);
      if (bd < 1) return [ORANGE, 0.85, x / 0.38, (y + 0.42) / 0.46];
      // Cola: curva que sale de detrás y se enrosca a la derecha; se mece.
      var sway = Math.sin(t * (1.4 + wag * 6)) * (0.1 + wag * 0.25);
      for (var i = 0; i <= 24; i++) {
        var u = i / 24;
        var px = 0.2 + 0.62 * u - 0.12 * u * u * u + sway * u * u * 0.5;
        var py = -0.8 + 0.06 * u + 0.42 * u * u * u + sway * u * u * 0.4;
        var r = 0.09 + 0.12 * Math.sin(Math.PI * Math.min(1, 0.2 + u * 0.95));
        var d = ell(x, y, px, py, r, r);
        if (d < 1) return u > 0.82 ? [CREAM, 0.95, 0, 0] : [ORANGE, 0.82, (x - px) / r, (y - py) / r];
      }
      return null;
    }

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cellH = Math.max(6, Math.min(9, Math.min(W, H) / 110)); cellW = cellH * 0.62;
      cols = Math.ceil(W / cellW); rows = Math.ceil(H / cellH);
      scale = Math.min(W * 0.55, H * 0.36); cx = W * 0.5; cy = H * 0.55;
      if (!leaves.length) for (var i = 0; i < 46; i++) leaves.push(newLeaf(true));
    }
    var LEAF_COLORS = ["#e8742c", "#d94f2b", "#f2a33a", "#b8492a", "#f5c04a"];
    function newLeaf(anywhere) {
      return { x: Math.random() * W, y: anywhere ? Math.random() * H : -20, v: 14 + Math.random() * 22,
        ph: Math.random() * 6.3, c: LEAF_COLORS[(Math.random() * LEAF_COLORS.length) | 0],
        g: "*%&@#"[(Math.random() * 5) | 0] };
    }

    function frame(t) {
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
      ctx.font = "700 " + cellH + "px 'Courier New', monospace"; ctx.textBaseline = "top";
      look.x += (lookT.x - look.x) * 0.06; look.y += (lookT.y - look.y) * 0.06;
      wag = Math.max(0, wag - 0.006);
      var groups = {};
      function put(ch, c, x, y) { (groups[c] || (groups[c] = [])).push(ch, x, y); }
      // Estrellas tenues.
      for (var j = 0; j < rows * 0.55; j += 1) for (var i = 0; i < cols; i++) {
        var hsh = hash(i, j);
        if (hsh > 0.996) put(hsh > 0.999 ? "+" : ".", "rgba(246,231,234," + (0.25 + 0.4 * Math.abs(Math.sin(t * 0.8 + hsh * 50))).toFixed(2) + ")", i * cellW, j * cellH);
      }
      // Suelo de hojarasca.
      var ground = cy + 0.86 * scale;
      for (j = Math.floor(ground / cellH); j < rows; j++) for (i = 0; i < cols; i++) {
        var h2 = hash(i * 1.7, j * 2.3), depth = (j * cellH - ground) / (H - ground + 1);
        if (h2 < 0.55 + depth * 0.4) put(RAMP[2 + ((h2 * 10) | 0)], LEAF_COLORS[(h2 * 50 | 0) % 5], i * cellW, j * cellH);
      }
      // Zorro.
      var shadow = 0;
      for (j = 0; j < rows; j++) {
        var y = (cy - j * cellH) / scale;
        if (y < -0.95 || y > 0.8) continue;
        for (i = 0; i < cols; i++) {
          var x = (i * cellW - cx) / scale;
          if (x < -0.55 || x > 1.05) continue;
          var f = fox(x, y, t);
          if (!f) continue;
          var light = 0.62 + 0.38 * Math.max(-1, Math.min(1, -f[2] * 0.6 + f[3] * 0.8)) * 0.5 + 0.19;
          var fur = 0.82 + 0.18 * hash(i, j + ((t * 2) | 0) * 0.0);
          var lum = Math.max(0.05, Math.min(1, f[1] * light * fur));
          var c = f[0], k = 0.45 + 0.65 * lum;
          var col = "rgb(" + Math.min(255, c[0] * k | 0) + "," + Math.min(255, c[1] * k | 0) + "," + Math.min(255, c[2] * k | 0) + ")";
          put(RAMP[Math.min(RAMP.length - 1, 4 + (lum * (RAMP.length - 5)) | 0)], col, i * cellW, j * cellH);
        }
      }
      // Hojas que caen.
      var dt = 1 / 60;
      leaves.forEach(function (l, n) {
        l.y += l.v * dt * (reduce ? 0 : 1); l.x += Math.sin(t * 1.2 + l.ph) * 0.5;
        if (l.y > H + 10) leaves[n] = newLeaf(false);
        put(l.g, l.c, l.x, l.y);
      });
      // Corazones al tocarlo.
      hearts = hearts.filter(function (h) { return t - h.t0 < 2.6; });
      hearts.forEach(function (h) {
        var a = (t - h.t0) / 2.6;
        put("♥", "rgba(255,120,150," + (1 - a).toFixed(2) + ")", h.x + Math.sin(a * 9 + h.ph) * 14, h.y - a * 140);
      });
      for (var c2 in groups) {
        ctx.fillStyle = c2; var g = groups[c2];
        for (var m = 0; m < g.length; m += 3) ctx.fillText(g[m], g[m + 1], g[m + 2]);
      }
    }

    function loop(ms) { frame(ms / 1000); requestAnimationFrame(loop); }
    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", function (e) {
      lookT.x = Math.max(-1, Math.min(1, (e.clientX - cx) / (W * 0.4)));
      lookT.y = Math.max(-1, Math.min(1, (cy - e.clientY) / (H * 0.4)));
    });
    canvas.addEventListener("pointerdown", function (e) {
      wag = 1;
      for (var i = 0; i < 7; i++) hearts.push({ x: cx + (Math.random() - 0.3) * scale * 0.5, y: cy - scale * 0.5,
        t0: performance.now() / 1000 + i * 0.12, ph: Math.random() * 6 });
    });
    resize();
    window.__zorro = { frame: frame };
    if (reduce) frame(1); else requestAnimationFrame(loop);
  </script>
</body>
</html>
